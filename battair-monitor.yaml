# battair-monitor: ESP32 DevKit, MAC 8c:4f:00:3c:cf:78, 192.168.0.188.
# Опрашивает по BLE шесть датчиков ISDT BattAir на LiPo 4S и отдает в HA
# напряжения банок, циклы, температуру, токи и счетчики аварий.
#
# Заменила Arduino-прошивку BattAirMonitor v2.2 (BLE -> MQTT через ArduinoHA).
# Ее исходник восстановлен в D:\MegaSync\Arduino\BattAirMonitor_v2_2\, полный
# дамп флеша перед перепрошивкой лежит там же. Протокол разобран в
# external_components/battair/battair.h.
#
# Как работает. Один ble_client по очереди подключается к каждому датчику:
# подписка на 0xBA01, рукопожатие, 11 команд, отключение. На датчик уходит
# около 3 секунд, обход всех шести раз в update_interval. Датчики вещают в
# эфир сами, MAC берется по имени из рекламы, если в слоте он не прописан.
# Слот BatN это датчик "BattAir N", номер как на корпусе. Имена сущностей
# Bat<n> ... остались от Arduino: на них завязаны уведомления о низком
# напряжении и разбалансе, Awtrix, экран esp32-cam1 и дашборды.
# У 1-й банки бывает просадка, за ней следит Cell Delta (разбаланс, мВ).
#
# OTA. У батарей плата сидит на ретрансляторе Keenetic Buddy Childroom, канал
# медленный, а BLE делит радио с Wi-Fi: обычная заливка рвется (Errno 104) раз
# за разом. Надежно так: нажать в HA "battair-monitor Safe Mode (OTA)", через
# 25 с залить, в safe mode BLE не стартует и OTA проходит с первого раза.

substitutions:
  board_name: 'battair-monitor'
  static_ip: '192.168.0.188'

esphome:
  name: ${board_name}
  friendly_name: BattAir Monitor
  # По устройству HA на каждую батарею, сама плата остается BattAir Monitor.
  devices:
    - {id: bat1_dev, name: BattAir 1}
    - {id: bat2_dev, name: BattAir 2}
    - {id: bat3_dev, name: BattAir 3}
    - {id: bat4_dev, name: BattAir 4}
    - {id: bat5_dev, name: BattAir 5}
    - {id: bat6_dev, name: BattAir 6}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml
  base_sensors: !include packages/2common_sensors.yaml
  led: !include packages/3status_led_esp32.yaml
  diag: !include packages/diag.yaml

external_components:
  - source:
      type: local
      path: external_components
    components: [battair]

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  # Адрес меняется на ходу компонентом battair, здесь заглушка.
  - id: battair_ble
    mac_address: '00:00:00:00:00:00'
    auto_connect: false

battair:
  id: battair_hub
  ble_client_id: battair_ble
  update_interval: 5min
  # Как в Arduino v2.2. На -85..-90 дБм соединение часто падает со status 133.
  attempts: 5
  found_devices:
    name: Found Devices
  scan_counter:
    name: Scan Counter
  log:
    name: Log
  batteries:
    # MAC сняты с эфира 08.10.2026. Пустой mac: '' значит искать по имени (для замены модуля).
    - !include {file: packages/battair_bat.yaml, vars: {n: 1, ble: 'BattAir 1', mac: 'E0:4E:7A:27:1E:28'}}
    - !include {file: packages/battair_bat.yaml, vars: {n: 2, ble: 'BattAir 2', mac: '54:14:A7:D1:13:31'}}
    - !include {file: packages/battair_bat.yaml, vars: {n: 3, ble: 'BattAir 3', mac: 'E0:4E:7A:26:F3:A7'}}
    - !include {file: packages/battair_bat.yaml, vars: {n: 4, ble: 'BattAir 4', mac: 'E0:4E:7A:26:F5:49'}}
    - !include {file: packages/battair_bat.yaml, vars: {n: 5, ble: 'BattAir 5', mac: 'E0:4E:7A:27:05:AF'}}
    - !include {file: packages/battair_bat.yaml, vars: {n: 6, ble: 'BattAir 6', mac: '54:14:A7:D1:5C:FF'}}

button:
  - platform: template
    name: Poll Now
    icon: mdi:refresh
    on_press:
      - lambda: id(battair_hub).poll_now();
