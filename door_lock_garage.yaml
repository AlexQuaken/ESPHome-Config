substitutions:
  board_name: 'door_lock_garage'
  static_ip: '192.168.0.175'
  pulse_time: '1200ms'

esphome:
  name: ${board_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay_open
      - switch.turn_off: relay_close

esp8266:
  board: esp01_1m

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml
  base_sensors: !include packages/2common_sensors.yaml

# UART занят разговором с бортовым STC15, он и щелкает реле.
# Логи в порт слать нельзя: STC15 поймает мусор и откроет замок.
# Адрес пока по DHCP: manual_ip из общего пакета убираем точечно,
# сам пакет трогать нельзя, он общий для всех устройств.
wifi:
  manual_ip: !remove

logger:
  baud_rate: 0

uart:
  id: relay_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
      timeout: 200ms

switch:
  - platform: template
    id: relay_open
    internal: true
    optimistic: true
    turn_on_action:  { uart.write: [0xA0, 0x01, 0x01, 0xA2] }
    turn_off_action: { uart.write: [0xA0, 0x01, 0x00, 0xA1] }
  - platform: template
    id: relay_close
    internal: true
    optimistic: true
    turn_on_action:  { uart.write: [0xA0, 0x02, 0x01, 0xA3] }
    turn_off_action: { uart.write: [0xA0, 0x02, 0x00, 0xA2] }

# Проба: на части ревизий этой платы реле висят прямо на ножках ESP-01.
# inverted + ALWAYS_OFF держат на пинах высокий уровень в покое,
# иначе GPIO0 в нуле уведет модуль в загрузчик при следующем старте.
  - platform: gpio
    name: "${board_name}_gpio0_probe"
    id: gpio0_probe
    pin:
      number: GPIO0
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "${board_name}_gpio2_probe"
    id: gpio2_probe
    pin:
      number: GPIO2
      inverted: true
    restore_mode: ALWAYS_OFF

lock:
  - platform: template
    name: ${board_name}
    id: garage_lock
    optimistic: true
    lock_action:
      - switch.turn_off: relay_open
      - delay: 100ms
      - switch.turn_on: relay_close
      - delay: ${pulse_time}
      - switch.turn_off: relay_close
    unlock_action:
      - switch.turn_off: relay_close
      - delay: 100ms
      - switch.turn_on: relay_open
      - delay: ${pulse_time}
      - switch.turn_off: relay_open
