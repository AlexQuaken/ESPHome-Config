# Waveshare ESP32-C6-LCD-1.47 (без тача), ST7789 172x320
# Log/radar через packages/ble_radar.yaml — единый код с alex_3, esp32-5-ant, esp32-17
substitutions:
  board_name: 'esp32-c6-lcd'
  static_ip: '192.168.0.215'
  number: '215'
  # номер в таблице ESP; number не трогаем, он вшит в имена BLE-сенсоров
  # (esp32_c6_lcd_*_ble_215) и в базу позиционирования tools/ble_locator
  board_id: '22'
  pin_clk: GPIO7
  pin_mosi: GPIO6
  pin_cs: GPIO14
  pin_dc: GPIO15
  pin_reset: GPIO21
  pin_bl: GPIO22
  # У этого экрана 172px высота, не 170 (Waveshare LCD-1.47)
  lcd_height: "172"
  lcd_offset_h: "34"

esphome:
  name: ${board_name}
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(log_lines).push_back("${board_name} booted");
            id(log_lines).push_back("display OK");
            id(display_mode) = 2;   // по умолчанию экран NAS
  includes:
    - nasmon/nasmon.h

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml
  base_sensors: !include packages/2common_sensors.yaml
  ble_common: !include packages/ble_common.yaml
  ble_alex: !include packages/ble_alex.yaml
  ble_ira: !include packages/ble_ira.yaml
  ble_lila: !include packages/ble_lila.yaml
  ble_radar: !include packages/ble_radar.yaml
  diag: !include packages/diag.yaml

# Встроенный RGB LED на C6 (GPIO8) — вместо обычного status_led
light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: ${board_name} RGB
    pin: GPIO8
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812

# ---- Экран мониторинга DS1019+ (режим 2), данные от nasmon.py на NAS ----
# Исходники: D:\MegaSync\DropBoxUtils\MyUtils\NasMonitor (nasmon.h, шрифты BDF из растров T-Display)
http_request:
  verify_ssl: false
  timeout: 2s

font:
  - file: "fonts/nasmon_6x8.bdf"
    id: f_nm6
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°↓↑'
  - file: "fonts/nasmon_8x16.bdf"
    id: f_nm16
    glyphs: '0123456789%°'
  - file: "fonts/nasmon_16x32.bdf"
    id: f_nm32
    glyphs: '0123456789%'

switch:
  - platform: template
    name: ${board_name} NAS Monitor
    id: nas_monitor_sw
    lambda: 'return id(display_mode) == 2;'
    turn_on_action:
      - lambda: 'id(display_mode) = 2;'
    turn_off_action:
      - lambda: 'id(display_mode) = 1;'

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(display_mode) == 2;'
          then:
            - http_request.get:
                url: http://192.168.0.7:8099/nas.json
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: 'nasmon::parse(body);'
  # экран NAS перерисовывать раз в 0,5 с, радар и журнал как раньше 33 мс
  - interval: 1s
    then:
      - lambda: |-
          static int last = -1;
          int m = id(display_mode);
          if (m != last) {
            id(lcd).set_update_interval(m == 2 ? 500 : 33);
            id(lcd).start_poller();
            last = m;
          }
