# Guition JC4827W543C: дашборд гаража в стиле exceltable.com, шаблон 002
# «KPI дашборд с ярким дизайном» (темные панели, неоновая обводка, градиент
# оранжевый -> малиновый). Пока на тестовых данных, близких к реальным.
#
# Это вторая прошивка для той же платы, что и esp32-s3-disp.yaml (лог-консоль
# и BLE-радар). Имя и адрес те же, чтобы запись в HA не менялась. Какая стоит
# на плате, решает то, какой файл залит последним. Сборка у обоих общая
# (.esphome/build/esp32-s3-disp), при переключении пересобирается целиком.
#
# Экран на LVGL: скругления, градиенты и свечение через тень. Шрифты
# растровые, без сглаживания (bpp 1), каждый в родном размере или ровно x2.
# Радар и график с заливкой рисуются лямбдой на холстах (скрипт draw_charts):
# штатное lvgl.canvas.draw_polygon в LVGL 9 рисует только контур.
#
# Что где и откуда потом возьмутся данные (домашний гараж):
#   синяя плашка   мощность гаража сейчас    sensor.schetchik_garazh_power
#   СЕГОДНЯ        розетки / свет / зарядка  sensor.garage_*_daily
#   ЗАРЯДКА АВТО   сессия ночной зарядки     sensor.garage_*_charge_session
#   полоса 23-07   ход окна зарядки          input_datetime.garage_charge_*
#   фишки          ворота, охрана, свет, движение
#   СЕНТЯБРЬ       гараж за месяц            sensor.garage_*_monthly
#   кольцевая      доля линий за месяц       sensor.garage_*_monthly
#   СЕТЬ (радар)   напряжение, частота, cos, ток, нагрев, утечка (ATORCH)
#   КЛИМАТ         температура, влажность, давление, нагрев розетки, батарейки
#   столбики       гараж по месяцам          статистика sensor.schetchik_garazh_energy
#   график         мощность за сутки         история sensor.schetchik_garazh_power
substitutions:
  board_name: 'esp32-s3-disp'
  static_ip: '192.168.0.221'

esphome:
  name: ${board_name}
  # копии столбиков через <<: *vbar переопределяют x и value, так и задумано
  merge_warnings: false
  on_boot:
    - priority: -100
      then:
        - delay: 500ms
        - script.execute: draw_charts

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi
  password: !secret wifipwd
  fast_connect: true
  reboot_timeout: 3min
  manual_ip:
    static_ip: ${static_ip}
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.7
    dns2: 192.168.0.1
  ap:
    ssid: ${board_name}_Fallback
    password: !secret wifipwd

captive_portal:

api:

ota:
  platform: esphome
  password: !secret wifipwd

logger:
  level: INFO

# Перезагрузка в первые 15 секунд после OTA откатывает на прошлую прошивку
safe_mode:
  boot_is_good_after: 15s

button:
  - platform: safe_mode
    name: ${board_name} Safe Mode (OTA)

output:
  - platform: ledc
    pin: GPIO1
    id: backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: ${board_name} Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON

i2c:
  id: i2c_bus
  sda: GPIO8
  scl: GPIO4
  frequency: 400kHz

spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  # Настройки панели те же, что в esp32-s3-disp.yaml: INVON, шина не выше
  # паспортных 32 МГц. Поворот на 180 при LVGL задается в блоке lvgl. Без лямбды драйвер работает без своего
  # буфера, кадры в панель пишет LVGL.
  - platform: mipi_spi
    id: lcd
    model: JC4827W543
    spi_id: quad_spi
    invert_colors: true
    data_rate: 26.67MHz
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: ts
    i2c_id: i2c_bus
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO38

font:
  # Пиксельные шрифты из пака int10h (PxPlus = с кириллицей), bpp 1 без
  # сглаживания. Попадают в пиксель только в родном размере или кратном ему.
  - file: "fonts/PxPlus_HP_100LX_6x8.ttf"
    id: fs
    size: 8
    bpp: 1
    glyphs: &glyphs " !%()+,-./0123456789:;°·ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюя"
  - file: "fonts/PxPlus_IBM_VGA_8x14.ttf"
    id: fm
    size: 14
    bpp: 1
    glyphs: *glyphs
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: fb
    size: 16
    bpp: 1
    glyphs: *glyphs
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: fx
    size: 32
    bpp: 1
    glyphs: " %.0123456789"

script:
  # Радар и график с заливкой. Заливка веером треугольников от центра
  # (радар) и трапециями из двух треугольников (график) через lv_draw_triangle.
  - id: draw_charts
    then:
      - lambda: |-
          auto line = [](lv_layer_t *l, float x1, float y1, float x2, float y2, uint32_t c, int w, lv_opa_t o) {
            lv_draw_line_dsc_t d; lv_draw_line_dsc_init(&d);
            d.p1.x = x1; d.p1.y = y1; d.p2.x = x2; d.p2.y = y2;
            d.color = lv_color_hex(c); d.width = w; d.opa = o;
            d.round_start = 1; d.round_end = 1;
            lv_draw_line(l, &d);
          };
          auto tri = [](lv_layer_t *l, float ax, float ay, float bx, float by, float cx, float cy,
                        uint32_t c, lv_opa_t o, uint32_t c2 = 0, lv_opa_t o2 = 0) {
            lv_draw_triangle_dsc_t d; lv_draw_triangle_dsc_init(&d);
            d.p[0].x = ax; d.p[0].y = ay; d.p[1].x = bx; d.p[1].y = by; d.p[2].x = cx; d.p[2].y = cy;
            d.color = lv_color_hex(c); d.opa = o;
            if (o2) {
              d.grad.dir = LV_GRAD_DIR_VER; d.grad.stops_count = 2;
              d.grad.stops[0].color = lv_color_hex(c);  d.grad.stops[0].opa = o;  d.grad.stops[0].frac = 0;
              d.grad.stops[1].color = lv_color_hex(c2); d.grad.stops[1].opa = o2; d.grad.stops[1].frac = 255;
            }
            lv_draw_triangle(l, &d);
          };
          auto dot = [](lv_layer_t *l, float x, float y, int r, uint32_t c) {
            lv_draw_rect_dsc_t d; lv_draw_rect_dsc_init(&d);
            d.bg_color = lv_color_hex(c); d.bg_opa = LV_OPA_COVER; d.radius = LV_RADIUS_CIRCLE;
            d.border_color = lv_color_hex(0xffffff); d.border_width = 1;
            lv_area_t a = {(int32_t)(x - r), (int32_t)(y - r), (int32_t)(x + r), (int32_t)(y + r)};
            lv_draw_rect(l, &d, &a);
          };

          // ---------- радар сети, холст 160x88, центр (62,44), r=28 ----------
          {
            lv_obj_t *cv = (lv_obj_t *) id(radar_cv);
            lv_canvas_fill_bg(cv, lv_color_hex(0x0d1433), LV_OPA_COVER);
            lv_layer_t l; lv_canvas_init_layer(cv, &l);
            const float cx = 62, cy = 44, R = 28;
            const int N = 6;
            const float v[N] = {0.95f, 0.98f, 0.48f, 0.62f, 0.45f, 0.12f};   // тест: U, f, cos, I, нагрев, утечка
            float ax[N], ay[N];
            for (int i = 0; i < N; i++) {
              float a = -M_PI / 2 + i * 2 * M_PI / N;
              ax[i] = cosf(a); ay[i] = sinf(a);
            }
            for (int ring = 1; ring <= 4; ring++) {
              float r = R * ring / 4;
              for (int i = 0; i < N; i++) {
                int j = (i + 1) % N;
                line(&l, cx + ax[i] * r, cy + ay[i] * r, cx + ax[j] * r, cy + ay[j] * r, 0x3a4a86, 1, LV_OPA_70);
              }
            }
            for (int i = 0; i < N; i++) line(&l, cx, cy, cx + ax[i] * R, cy + ay[i] * R, 0x3a4a86, 1, LV_OPA_70);
            // три слоя заливки дают переход от оранжевого в центре к малиновому по краю
            const float sc[3] = {1.0f, 0.72f, 0.42f};
            const uint32_t col[3] = {0xd63fe0, 0xff5f8f, 0xffa040};
            for (int k = 0; k < 3; k++)
              for (int i = 0; i < N; i++) {
                int j = (i + 1) % N;
                float ri = R * v[i] * sc[k], rj = R * v[j] * sc[k];
                tri(&l, cx, cy, cx + ax[i] * ri, cy + ay[i] * ri, cx + ax[j] * rj, cy + ay[j] * rj, col[k], LV_OPA_90);
              }
            for (int i = 0; i < N; i++) {
              int j = (i + 1) % N;
              line(&l, cx + ax[i] * R * v[i], cy + ay[i] * R * v[i], cx + ax[j] * R * v[j], cy + ay[j] * R * v[j], 0xffd0f0, 1, LV_OPA_COVER);
            }
            for (int i = 0; i < N; i++) dot(&l, cx + ax[i] * R * v[i], cy + ay[i] * R * v[i], 2, 0xff7ab8);
            lv_canvas_finish_layer(cv, &l);
          }

          // ---------- мощность гаража за сутки, холст 224x60 ----------
          {
            lv_obj_t *cv = (lv_obj_t *) id(area_cv);
            lv_canvas_fill_bg(cv, lv_color_hex(0x0c1230), LV_OPA_COVER);
            lv_layer_t l; lv_canvas_init_layer(cv, &l);
            const int N = 13;   // 0..24 часа через 2, ночью зарядка авто 23-07
            const float v[N] = {2.17f, 2.17f, 2.17f, 2.12f, 0.06f, 0.15f, 0.40f, 0.10f, 0.12f, 0.45f, 0.70f, 0.30f, 2.17f};  // тест, кВт
            const float x0 = 4, dx = 18, bot = 58, top = 6, vmax = 2.5f;
            for (int g = 1; g <= 4; g++) {
              float y = bot - (bot - top) * g / 5;
              line(&l, 0, y, 224, y, 0x26325f, 1, LV_OPA_60);
            }
            float px[N], py[N];
            for (int i = 0; i < N; i++) { px[i] = x0 + i * dx; py[i] = bot - (bot - top) * v[i] / vmax; }
            for (int i = 0; i + 1 < N; i++) {
              tri(&l, px[i], py[i], px[i + 1], py[i + 1], px[i], bot, 0x9b6bff, LV_OPA_90, 0x2a1a70, LV_OPA_50);
              tri(&l, px[i + 1], py[i + 1], px[i + 1], bot, px[i], bot, 0x9b6bff, LV_OPA_90, 0x2a1a70, LV_OPA_50);
            }
            for (int i = 0; i + 1 < N; i++) line(&l, px[i], py[i], px[i + 1], py[i + 1], 0xc9b8ff, 2, LV_OPA_COVER);
            for (int k : {0, 6, 10}) {
              line(&l, px[k], py[k], px[k], bot, 0xc9b8ff, 1, LV_OPA_50);
              dot(&l, px[k], py[k], 3, 0x8a5cff);
            }
            lv_canvas_finish_layer(cv, &l);
          }

lvgl:
  displays: [lcd]
  rotation: 180
  touchscreens: [ts]
  buffer_size: 25%
  default_font: fs
  theme:
    obj:
      pad_all: 0
      border_width: 0
      radius: 0
      bg_opa: TRANSP
      scrollbar_mode: "OFF"
      scrollable: false
    label:
      text_color: 0xe6ecff
    bar:
      pad_all: 0
      scrollable: false
  style_definitions:
    - id: panel
      bg_opa: COVER
      bg_color: 0x0f1636
      bg_grad_color: 0x0a0f26
      bg_grad_dir: VER
      radius: 10
      border_width: 1
      border_color: 0x27366e
    - id: glow_blue
      border_width: 2
      border_color: 0x4a9bff
      shadow_color: 0x2f7bff
      shadow_width: 12
      shadow_opa: 70%
    - id: glow_violet
      border_width: 2
      border_color: 0xb45cff
      shadow_color: 0x9b30ff
      shadow_width: 12
      shadow_opa: 70%
    - id: dim
      text_color: 0x8ea2d8
    - id: chip
      bg_opa: COVER
      bg_color: 0x18224a
      radius: 3
      text_color: 0x8ea2d8
      text_align: CENTER
    - id: chip_on
      bg_opa: COVER
      bg_color: 0x1e6bff
      radius: 3
      text_color: 0xffffff
      text_align: CENTER
  pages:
    - id: dash
      bg_opa: COVER
      bg_color: 0x050918
      bg_grad_color: 0x0c1438
      bg_grad_dir: VER
      scrollable: false
      widgets:
        # ================= ряд 1 =================
        - obj:
            x: 4
            y: 4
            width: 112
            height: 64
            styles: [panel]
            bg_color: 0x2f86ff
            bg_grad_color: 0x1238b8
            bg_grad_dir: HOR
            radius: 12
            border_width: 0
            shadow_color: 0x2f7bff
            shadow_width: 14
            shadow_opa: 70%
            widgets:
              - label: {x: 8, y: 5, text: "ГАРАЖ СЕЙЧАС", text_font: fs}
              - label: {x: 7, y: 15, text: "2.17", text_font: fx}
              - label: {x: 76, y: 32, text: "кВт", text_font: fm}
              - label: {x: 8, y: 52, text: "заряжается авто", text_font: fs, text_color: 0xcfe0ff}

        - obj:
            x: 120
            y: 4
            width: 120
            height: 64
            styles: [panel]
            widgets:
              - label: {x: 0, y: 4, width: 120, text: "СЕГОДНЯ, кВт·ч", text_font: fs, text_align: CENTER, text_color: 0xaab8f0}
              - label: {x: 10, y: 17, text: "Розетки", text_font: fs, styles: [dim]}
              - label: {x: 70, y: 17, width: 40, text: "12.4", text_font: fs, text_align: RIGHT}
              - label: {x: 10, y: 28, text: "Свет", text_font: fs, styles: [dim]}
              - label: {x: 70, y: 28, width: 40, text: "0.3", text_font: fs, text_align: RIGHT}
              - label: {x: 10, y: 39, text: "Зарядка", text_font: fs, styles: [dim]}
              - label: {x: 70, y: 39, width: 40, text: "0.0", text_font: fs, text_align: RIGHT}
              - obj: {x: 10, y: 49, width: 100, height: 1, bg_opa: COVER, bg_color: 0x27366e}
              - label: {x: 10, y: 52, text: "ВСЕГО", text_font: fs}
              - label: {x: 70, y: 52, width: 40, text: "12.7", text_font: fs, text_align: RIGHT}

        - obj:
            x: 244
            y: 4
            width: 120
            height: 40
            styles: [panel, glow_violet]
            widgets:
              - label: {x: 0, y: 5, width: 116, text: "ЗАРЯДКА АВТО", text_font: fs, text_align: CENTER, text_color: 0xaab8f0}
              - label: {x: 0, y: 17, width: 116, text: "16.7 кВт·ч", text_font: fb, text_align: CENTER}

        - obj:
            x: 244
            y: 48
            width: 120
            height: 20
            styles: [panel]
            radius: 8
            widgets:
              - label: {x: 6, y: 6, text: "23-07", text_font: fs, styles: [dim]}
              - bar:
                  x: 40
                  y: 6
                  width: 74
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 64
                  bg_opa: COVER
                  bg_color: 0x1a2350
                  radius: 4
                  indicator:
                    bg_color: 0xff9a3c
                    bg_grad_color: 0xe040fb
                    bg_grad_dir: HOR
                    radius: 4
              - label: {x: 40, y: 6, width: 74, text: "64%", text_font: fs, text_align: CENTER}

        - obj:
            x: 368
            y: 4
            width: 108
            height: 64
            styles: [panel]
            widgets:
              - label: {x: 5, y: 5, width: 47, height: 12, text: "ВОРОТА", text_font: fs, pad_top: 2, styles: [chip]}
              - label: {x: 56, y: 5, width: 47, height: 12, text: "ОХРАНА", text_font: fs, pad_top: 2, styles: [chip_on]}
              - label: {x: 5, y: 20, width: 47, height: 12, text: "СВЕТ", text_font: fs, pad_top: 2, styles: [chip]}
              - label: {x: 56, y: 20, width: 47, height: 12, text: "ДВИЖ.", text_font: fs, pad_top: 2, styles: [chip]}
              - label: {x: 0, y: 36, width: 108, text: "СЕНТЯБРЬ", text_font: fm, text_align: CENTER}
              - label: {x: 0, y: 52, width: 102, text: "34.2 кВт·ч", text_font: fs, text_align: RIGHT, styles: [dim]}

        # ================= ряд 2 =================
        - obj:
            x: 4
            y: 72
            width: 128
            height: 92
            styles: [panel]
            widgets:
              # кольцевая из трех дуг, 0 градусов сверху (rotation 270)
              - arc: &seg
                  x: 6
                  y: 14
                  width: 64
                  height: 64
                  rotation: 270
                  start_angle: 0
                  end_angle: 311
                  adjustable: false
                  clickable: false
                  arc_width: 9
                  arc_color: 0xff9a3c
                  arc_rounded: false
                  indicator:
                    arc_opa: TRANSP
                  knob:
                    bg_opa: TRANSP
                    pad_all: 0
              - arc:
                  <<: *seg
                  start_angle: 314
                  end_angle: 350
                  arc_color: 0xe040fb
              - arc:
                  <<: *seg
                  start_angle: 353
                  end_angle: 358
                  arc_color: 0x3f8cff
              - label: {x: 6, y: 35, width: 64, text: "19.0", text_font: fb, text_align: CENTER}
              - label: {x: 6, y: 51, width: 64, text: "кВт·ч", text_font: fs, text_align: CENTER, styles: [dim]}
              - obj: {x: 76, y: 14, width: 7, height: 7, bg_opa: COVER, bg_color: 0xff9a3c, radius: 2}
              - label: {x: 86, y: 14, text: "87%", text_font: fs}
              - label: {x: 76, y: 24, text: "Розетки", text_font: fs, styles: [dim]}
              - obj: {x: 76, y: 38, width: 7, height: 7, bg_opa: COVER, bg_color: 0xe040fb, radius: 2}
              - label: {x: 86, y: 38, text: "11%", text_font: fs}
              - label: {x: 76, y: 48, text: "Свет", text_font: fs, styles: [dim]}
              - obj: {x: 76, y: 62, width: 7, height: 7, bg_opa: COVER, bg_color: 0x3f8cff, radius: 2}
              - label: {x: 86, y: 62, text: "2%", text_font: fs}
              - label: {x: 76, y: 72, text: "Зарядка", text_font: fs, styles: [dim]}

        - obj:
            x: 136
            y: 72
            width: 164
            height: 92
            styles: [panel, glow_violet]
            bg_color: 0x0d1433
            bg_grad_dir: NONE
            widgets:
              - canvas:
                  id: radar_cv
                  x: 2
                  y: 2
                  width: 160
                  height: 88
              # подписи осей: центр радара в координатах панели (64,46), r=28
              - label: {x: 34, y: 4, width: 60, text: "Напряж.", text_font: fs, text_align: CENTER, styles: [dim]}
              - label: {x: 91, y: 26, text: "Частота", text_font: fs, styles: [dim]}
              - label: {x: 91, y: 58, text: "Косинус", text_font: fs, styles: [dim]}
              - label: {x: 34, y: 80, width: 60, text: "Ток", text_font: fs, text_align: CENTER, styles: [dim]}
              - label: {x: 0, y: 58, width: 37, text: "Утечка", text_font: fs, text_align: RIGHT, styles: [dim]}
              - label: {x: 0, y: 26, width: 37, text: "Нагрев", text_font: fs, text_align: RIGHT, styles: [dim]}
              - label: {x: 118, y: 5, width: 40, text: "СЕТЬ", text_font: fs, text_align: RIGHT, text_color: 0xaab8f0}
              - label: {x: 110, y: 72, width: 48, text: "232 В", text_font: fb, text_align: RIGHT}

        - obj:
            x: 304
            y: 72
            width: 172
            height: 92
            styles: [panel]
            widgets:
              - label: {x: 0, y: 4, width: 164, text: "КЛИМАТ", text_font: fs, text_align: RIGHT, text_color: 0xaab8f0}
              - label: {x: 8, y: 14, text: "Температура", text_font: fs}
              - label: {x: 110, y: 14, width: 54, text: "15.4°", text_font: fs, text_align: RIGHT}
              - bar: &hbar
                  x: 8
                  y: 24
                  width: 156
                  height: 3
                  min_value: 0
                  max_value: 100
                  value: 45
                  bg_opa: COVER
                  bg_color: 0x1a2350
                  radius: 2
                  indicator:
                    bg_color: 0xff9a3c
