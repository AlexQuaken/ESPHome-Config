            height: 64
            styles: [panel]
            widgets:
              - label: {x: 5, y: 5, width: 30, height: 13, text: "2025", text_font: f10, styles: [chip]}
              - label: {x: 39, y: 5, width: 30, height: 13, text: "2026", text_font: f10, styles: [chip_on]}
