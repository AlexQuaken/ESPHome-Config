              - label: {x: 0, y: 24, width: 37, text: "Кабинет", text_font: f10, text_align: RIGHT, styles: [dim]}
              - label: {x: 118, y: 4, width: 40, text: "КЛИМАТ", text_font: f10, text_align: RIGHT, text_color: 0xaab8f0}
              - label: {x: 118, y: 66, width: 40, text: "22.4°", text_font: f14, text_align: RIGHT}

        - obj:
