        - label: {x: 10, y: 158, text: "════════════════════════════════════════════════════════════════════════════", text_font: fs, styles: [dim]}
        - label: {x: 10, y: 168, text: "ЖУРНАЛ"}
        # журнал: время / что / состояние, новая строка ярче
        - label: {id: e0t, x: 10, y: 184, text: ""}
