# garage-home-panel, экран в гараже у дома. До 09.10.2026 была esp32-23-garage, еще раньше esp32-s3-disp (ID 23 тот же).
# Guition JC4827W543C (ESP32-S3-WROOM-1 N4R8, 4.3" IPS 480x272, NV3041A по QSPI,
# тач GT911). На экране одна панель «Неоновые статусы» с календарем энергии и
# пин-панелью охраны (garage_status_ui.h, выбрана 28.09.2026 из 40 макетов).
# 11.10.2026 по просьбе убрано все остальное: консоль лога, BLE-радар, ретро-
# терминал и картинка с камеры Reolink (не работала и, похоже, роняла плату).
# Сборка без них проще, и памяти больше.
#
# Тап по экрану это кнопки панели. СВЕТ переключает свет, ЗАРЯДКА линию зарядки
# авто, ОХРАНА ставит на охрану, а снимает только через пин-панель (код в secrets,
# минута на ввод), график открывает календарь, события часы суток, кольца доли линий.
#
# ALARM. Ворота открыли на охране (пульт HA в pending, отсчет alarm_delay, 30 секунд до
# сирены): поверх всего встает экран ALARM с отсчетом, а панель мигает аппаратной
# инверсией 4 раза в секунду. Первое касание гасит мигание и открывает пин-панель,
# сам тап кнопок не нажимает. Сняли раньше меткой (или из HA), экран ALARM и
# пин-панель закрываются сами. Отсчет ушел в тревогу, на экране «СИРЕНА ВКЛЮЧЕНА».
# Посмотреть без настоящей тревоги: действие esphome.garage_home_panel_alarm_preview.
# Охрана это manual-пульт HA alarm_control_panel.garazh_okhrana, снимают его
# BLE-метки Alex, Иры и Лили (garage_tag_* ниже) или пин на экране.
#
# Данные статусов: текущие значения берутся из HA (platform homeassistant),
# историю (24 часа мощности, 30 дней и 12 месяцев энергии) присылает действием
# set_history автоматизация garage_dash_push_history
# (HomeAssistant/automations/misc/garage_dash.yaml), раз в 10 минут и при
# подключении платы. Журнал событий плата ведет сама, 6 строк во флеше.
#
# Одно радио на Wi-Fi и BLE: окно скана 330 мс из 1100, иначе Wi-Fi голодает.
# Флеш 4 МБ, под прошивку в слоте OTA 1,75 МБ.
# Скриншот экрана: http://192.168.0.163:8080/screen.bmp (dash_snapshot.h).
#
# Распиновка (devices.esphome.io, guition-jc4827543c):
#   QSPI: CLK=47, D0..D3=21/48/40/39, CS=45 (задан в модели JC4827W543)
#   подсветка GPIO1 (PWM), GT911: SDA=8, SCL=4, INT=3, RST=38, кнопка BOOT GPIO0
substitutions:
  board_name: 'garage-home-panel'
  static_ip: '192.168.0.163'
  # ID платы в таблице ESP: первый свободный номер выше 20 (21 у t-display, 22 у C6)
  number: '23'
  # подстановки для общих пакетов, те же, что дает 1wifi_api_ota_logger
  update_interval: !secret update_interval
  mifit_alex: !secret mifit_alex
  mifit_ira: !secret mifit_ira
  mifit_lila: !secret mifit_lila
  alex_ble: !secret alex_ble
  ira_ble: !secret ira_ble
  lila_ble: !secret lila_ble
  # статусы: пин снятия с охраны (только на плате, в HA охрана без кода) и тариф
  alarm_pin: !secret garage_alarm_pin
  # второй пин, с 30.09.2026, снимает так же
  alarm_pin2: !secret garage_alarm_pin2
  tariff: '4.32'
  # отсчет до сирены, секунд: delay_time пульта в HomeAssistant/packages/garage_home.yaml
  # и длина звука отсчета в шлюзе, менять вместе (с 11.10.2026 30, до этого 60)
  alarm_delay: '30'
  # пароль сопряжения самоката Ninebot G3 для packages/ninebot_g3.yaml
  g3_password: !secret g3_password

# Общие пакеты, как у остальных плат. 1wifi_api_ota_logger сюда не подключен
# намеренно: Wi-Fi, API (со своими действиями) и OTA у этой платы свои и по сети и
# паролям с пакетом совпадают, а слияние задвоило бы блоки. ble_common тоже нет:
# сканер свой, с окном 30% под одно радио S3, BLE-присутствие работает поверх него.
# ble_alex/ira/lila тоже нет (с 30.09.2026): экран стоит в гараже, и его метки не
# должны попадать в домашнее присутствие (group.ble_* по префиксу <кто>_ble_).
# Свои метки garage_tag_* ниже, по ним HA снимает гараж с охраны.
packages:
  base_sensors: !include packages/2common_sensors.yaml
  diag: !include packages/diag.yaml
  diag_psram: !include packages/diag_psram.yaml
  # самокат Ninebot G3 по BLE раз в 5 минут, проба v5 с 28.10.2026
  ninebot_g3: !include packages/ninebot_g3.yaml
  # Ancel BM200 на 12-вольтовом аккумуляторе e-Golf, с 31.10.2026 (такой же, как на KTM в
  # кооперативе). Опрос раз в 10 минут: подключиться, команда, ответ, отключиться.
  bm6_egolf: !include {file: packages/bm6_battery.yaml, vars: {key: bm6_egolf, dev: egolf_dev, label: Battery, mac: "C8:17:F5:A7:CC:53", period_ms: "600000"}}
  # ПРОБА 31.10.2026: консоль ELM327 к vLinker FD+ в OBD e-Golf (OBD link / command / response)
  obd_vlinker: !include packages/obd_vlinker.yaml

esphome:
  name: ${board_name}
  # отдельное устройство в HA для аккумулятора машины (сенсоры bm6_egolf)
  devices:
    - id: egolf_dev
      name: e-Golf
  includes:
    - dash_snapshot.h
    - garage_status_ui.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            dash_snap::start(id(lvgl_comp).get_disp());
            // интерфейс строится кодом на странице p_status
            gs::EV = &id(g_ev);
            gs::EV_BASE = &id(g_ev_base);
            gs::LAST = &id(g_last);
            gs::JLOG = &id(g_log);
            gs::PINS = {"${alarm_pin}", "${alarm_pin2}"};
            gs::TARIFF = ${tariff};
            gs::ALARM_DELAY = ${alarm_delay};
            gs::cb_arm = []() { id(gs_arm).execute(); };
            gs::cb_disarm = []() { id(gs_disarm).execute(); };
            gs::cb_light = []() { id(gs_light).execute(); };
            gs::cb_charge = []() { id(gs_charge).execute(); };
            gs::cb_lock = []() { id(gs_lock).execute(); };
            gs::cb_flash_stop = []() { id(flash_stop).execute(); };
            gs::init(id(p_status)->obj, id(fs)->get_lv_font(), id(fm)->get_lv_font(), id(fb)->get_lv_font(),
                     id(f_alarm)->get_lv_font(), id(f_alarm_num)->get_lv_font());
        - delay: 500ms
        - script.execute: gs_refresh
        - wait_until:
            condition:
              api.connected:
            timeout: 40s
        # первые состояния после загрузки это не события, журнал не пишем
        - delay: 15s
        - lambda: 'id(g_log_armed) = true;'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      # запас под BLE-клиент самоката (ninebot), по умолчанию 8 КБ
      loop_task_stack_size: 16384
    sdkconfig_options:
      # BLE-стек по возможности в PSRAM. Буферы Wi-Fi/LWIP туда не уносить:
      # PSRAM занята буферами экрана и DMA, с ними пинг был 200-600 мс
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi
  password: !secret wifipwd
  fast_connect: true
  reboot_timeout: 3min
  manual_ip:
    static_ip: ${static_ip}
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.7
    dns2: 192.168.0.1
  ap:
    ssid: ${board_name}_Fallback
    password: !secret wifipwd

# Без него запасная точка доступа бесполезна, зайти на нее нечем
captive_portal:

api:
  actions:
    # История для статусов: power 24 часовых средних, кВт; months 12 месяцев,
    # кВт·ч; days 30 дней, кВт·ч, последний это сегодня; first_hour местный час
    # первого часового ведра; first_dow день недели первого дня (0 = пн);
    # first_day число месяца первого дня.
    - action: set_history
      variables:
        power: float[]
        months: float[]
        days: float[]
        first_hour: int
        first_dow: int
        first_day: int
      then:
        - lambda: |-
            id(g_power) = power;
            id(g_months) = months;
            id(g_days) = days;
            id(g_first_hour) = first_hour;
            id(g_first_dow) = first_dow;
            id(g_first_day) = first_day;
            ESP_LOGI("dash", "history: %u hours, %u months, %u days", (unsigned) power.size(),
                     (unsigned) months.size(), (unsigned) days.size());
            gs::H_VER++;
        - script.execute: gs_refresh
    # События статусов за 72 часа, разово из истории HA: lane 0 ворота, 1 свет,
    # 2 охрана, 3 движение; ts время события (unix). last время последнего события
    # по каждой дорожке, даже если оно старше 72 часов. Дальше плата пишет сама.
    - action: seed_events
      variables:
        lane: int[]
        ts: int[]
        last: int[]
      then:
        - lambda: |-
            auto t = id(homeassistant_time).now();
            if (!t.is_valid()) { ESP_LOGW("gs", "seed_events: no time yet"); return; }
            uint32_t now = t.timestamp;
            id(g_ev).fill(0);
            id(g_ev_base) = now / 3600;
            size_t n = std::min(lane.size(), ts.size());
            for (size_t i = 0; i < n; i++) gs::ev_add(lane[i], (uint32_t) ts[i], now);
            for (size_t k = 0; k < 4 && k < last.size(); k++) id(g_last)[k] = (uint32_t) last[k];
            gs::EV_VER++;
            ESP_LOGI("gs", "seeded %u events", (unsigned) n);
        - script.execute: gs_refresh
    # Для проверки без касаний: 0 главный, 1 календарь, 2 пин-панель,
    # 3 события (часы суток и журнал), 4 доли линий
    - action: status_screen
      variables:
        screen: int
      then:
        - lambda: |-
            if (screen == 1) gs::show_page(1);
            else if (screen == 2) { gs::show_page(0); gs::pin_open(); }
            else if (screen == 3 || screen == 4) gs::show_page(screen);
            else { gs::pin_close(); gs::show_page(0); }
    # Экран ALARM без настоящей тревоги: отсчет и мигание как при входе на охране,
    # касание открывает пин-панель. Сам закрывается через alarm_delay + 3 секунды.
    - action: alarm_preview
      then:
        - lambda: |-
            gs::alarm_show(true, false);
            id(g_flash) = true;

ota:
  platform: esphome
  password: !secret wifipwd

logger:
  level: INFO
  logs:
    font: ERROR
    display: ERROR
    mipi_spi: ERROR
    lvgl: ERROR
    component: ERROR
    scheduler: ERROR
    esp32_ble_tracker: INFO
    esp32_ble: INFO

# time (homeassistant_time) приходит из packages/2common_sensors.yaml

# После OTA прошивка считается непроверенной, пока не проработает
# boot_is_good_after. Перезагрузка в это окно (кнопка RESET) откатывает на
# прошлую прошивку из второго раздела. 24.09.2026 это приняли за «RESET
# ломает экран»: откат шел на сборку с неверной инверсией. Окно 15 секунд.
safe_mode:
  boot_is_good_after: 15s

button:
  - platform: safe_mode
    name: ${board_name} Safe Mode (OTA)

output:
  - platform: ledc
    pin: GPIO1
    id: backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: ${board_name} Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 300ms

i2c:
  id: i2c_bus
  sda: GPIO8
  scl: GPIO4
  frequency: 400kHz

spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  # Матрица родная ландшафтная 480x272, цвет правильный только при INVON
  # (invert_colors, проверено 24.09.2026 перебором). До 29.09.2026 плата висела
  # вверх ногами и стоял поворот на 180 (MADCTL 0xC0), потом ее перевесили,
  # и теперь панель в родной ориентации, MADCTL 0x00, поворота нет. Потолок NV3041A 32 МГц, шина ESP32 делит 80 МГц,
  # ближайшее ниже 26,67; на 40 МГц команды панели принимались через раз.
  # Без лямбды драйвер работает без своего буфера, кадры в панель пишет LVGL.
  - platform: mipi_spi
    id: lcd
    model: JC4827W543
    spi_id: quad_spi
    invert_colors: true
    data_rate: 26.67MHz
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: ts
    i2c_id: i2c_bus
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    # Тач привязан к стеклу и развернут относительно матрицы на 180: в родной
    # ориентации панели его координаты зеркальны по обеим осям.
    transform:
      mirror_x: true
      mirror_y: true

# Кнопка BOOT (GPIO0, слева на обороте платы): удержание 3-10 с переинициализирует
# панель. SW1 на верхнем торце это выключатель батареи (Battery button switch по
# спецификации), к GPIO он не подключен, прошивка его не видит. На IO0 по таблице
# выводов еще и LCD_TE панели: короткие импульсы отсекает delayed_on.
binary_sensor:
  - platform: gpio
    id: boot_btn
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
    on_click:
      - min_length: 3s
        max_length: 10s
        then:
          - logger.log: "BOOT held, panel reinit"
          - script.execute: panel_reinit
  - platform: homeassistant
    internal: true
    id: ha_gate
    entity_id: binary_sensor.garage_gate
    on_state:
      - lambda: |-
          id(log_event).execute("ВОРОТА", x ? "открыты" : "закрыты");
          if (x) id(gs_event).execute(0);
  - platform: homeassistant
    internal: true
    id: ha_motion
    entity_id: binary_sensor.garage_motion_any
    on_state:
      - lambda: |-
          id(log_event).execute("ДВИЖЕНИЕ", x ? "есть" : "нет");
          if (x) id(gs_event).execute(3);
  # BLE-метки для снятия гаража с охраны (packages/garage_home.yaml в HA).
  # Имена свои, не <кто>_ble_: в домашние группы присутствия они не попадают.
  # timeout 30 с вместо 5 минут: уехавший хозяин должен пропасть быстро, иначе
  # его «висящая» метка сняла бы охрану тому, кто откроет ворота следом.
  - platform: ble_presence
    mac_address: ${mifit_alex}
    name: Garage Tag Alex
    id: tag_alex
    timeout: 30s
  - platform: ble_presence
    mac_address: ${mifit_ira}
    name: Garage Tag Ira
    id: tag_ira
    timeout: 30s
  - platform: ble_presence
    mac_address: ${mifit_lila}
    name: Garage Tag Lila
    id: tag_lila
    timeout: 30s
  # по нему HA понимает, что плата вышла на связь, и сразу шлет историю дашборду
  - platform: status
    name: Status

sensor:
  - {platform: homeassistant, internal: true, id: ha_p_now, entity_id: sensor.schetchik_garazh_power}
  - {platform: homeassistant, internal: true, id: ha_volt, entity_id: sensor.schetchik_garazh_voltage}
  - {platform: homeassistant, internal: true, id: ha_d_sock, entity_id: sensor.garage_sockets_daily}
  - {platform: homeassistant, internal: true, id: ha_d_light, entity_id: sensor.garage_light_daily}
  - {platform: homeassistant, internal: true, id: ha_d_chg, entity_id: sensor.garage_charger_daily}
  - {platform: homeassistant, internal: true, id: ha_m_sock, entity_id: sensor.garage_sockets_monthly}
  - {platform: homeassistant, internal: true, id: ha_m_light, entity_id: sensor.garage_light_monthly}
  - {platform: homeassistant, internal: true, id: ha_m_chg, entity_id: sensor.garage_charger_monthly}
  - {platform: homeassistant, internal: true, id: ha_light_to, entity_id: input_number.garage_light_timeout}
  - platform: homeassistant
    internal: true
    id: ha_p_sock
    entity_id: sensor.rozetki_garazh_power
    on_value:
      - script.execute: check_charge
  - platform: homeassistant
    internal: true
    id: ha_p_chg
    entity_id: sensor.zariadka_avto_power
    on_value:
      - script.execute: check_charge

text_sensor:
  - {platform: homeassistant, internal: true, id: ha_line, entity_id: input_select.garage_charge_line}
  - {platform: homeassistant, internal: true, id: ha_chg_on, entity_id: input_boolean.garage_charge_enabled}
  - {platform: homeassistant, internal: true, id: ha_chg_start, entity_id: input_datetime.garage_charge_start}
  - {platform: homeassistant, internal: true, id: ha_chg_end, entity_id: input_datetime.garage_charge_end}
  # сама линия зарядки авто: ее переключает тап по панели ЗАРЯДКА в статусах
  - platform: homeassistant
    internal: true
    id: ha_chg_sw
    entity_id: switch.zariadka_avto
    on_value:
      - script.execute: gs_refresh
  - platform: homeassistant
    internal: true
    id: ha_light
    entity_id: switch.svet_garazh
    on_value:
      - lambda: |-
          if (x == "on") id(log_event).execute("СВЕТ", "вкл");
          else if (x == "off") id(log_event).execute("СВЕТ", "выкл");
          if (x == "on") id(gs_event).execute(1);
          id(gs_refresh).execute();
  - platform: homeassistant
    internal: true
    id: ha_lock
    # замок ворот, тап по плитке ВОРОТА открывает и закрывает (gs_lock)
    entity_id: lock.door_lock_garage
    on_value:
      - lambda: |-
          if (x == "locked") id(log_event).execute("ЗАМОК", "закрыт");
          else if (x == "unlocked") id(log_event).execute("ЗАМОК", "открыт");
          id(gs_refresh).execute();
  - platform: homeassistant
    internal: true
    id: ha_alarm
    # manual-пульт HA, с 30.09.2026 вместо родной охраны Шлюза 4
    entity_id: alarm_control_panel.garazh_okhrana
    on_value:
      - lambda: |-
          const char *s = x.rfind("armed", 0) == 0 ? "под охраной" : x == "disarmed" ? "снята" :
                          x == "arming" ? "ставится" : x == "pending" ? "отсчет" :
                          x == "triggered" ? "ТРЕВОГА" : nullptr;
          if (s) id(log_event).execute("ОХРАНА", s);
          if (x.rfind("armed", 0) == 0 || x == "disarmed" || x == "triggered") id(gs_event).execute(2);
          // экран ALARM: показать на входе (pending) или в тревоге, убрать при снятии.
          // Повтор того же состояния (HA шлет его и на смену атрибутов) пропускается внутри.
          if (gs::alarm_state(x)) {
            id(g_flash) = true;
            ESP_LOGI("alarm", "%s, ALARM screen on", x.c_str());
          }
          id(gs_refresh).execute();

esp32_ble:
  enable_on_boot: true

# Сканер нужен только меткам garage_tag_* выше.
esp32_ble_tracker:
  id: ble_trk
  # На P4 окно было равно интервалу: BLE жил на C6, Wi-Fi не делил эфир.
  # У S3 радио одно, при 100% скана Wi-Fi и API начинают отваливаться.
  scan_parameters:
    interval: 1100ms
    window: 330ms
    active: false

interval:
  - interval: 2s
    then:
      - script.execute: gs_refresh
  # часы, отсчеты пин-панели и экрана ALARM
  - interval: 500ms
    then:
      - lambda: 'gs::tick(id(homeassistant_time).now());'
  # мигание экрана ALARM: инверсия панели 4 раза в секунду (смена фазы раз в 125 мс)
  - interval: 125ms
    then:
      - lambda: |-
          if (!id(g_flash)) return;
          id(g_flash_inv) = !id(g_flash_inv);
          id(panel_invert).execute(id(g_flash_inv));
  - interval: 100ms
    then:
      - lambda: 'dash_snap::loop(id(lvgl_comp).get_disp());'
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("hb", "up=%lus heap=%uKB int=%uKB",
                   (unsigned long)(millis()/1000),
                   (unsigned)(esp_get_free_heap_size()/1024),
                   (unsigned)(heap_caps_get_free_size(MALLOC_CAP_INTERNAL)/1024));

font:
  # PxPlus (int10h, с кириллицей и псевдографикой), bpp 1 без сглаживания,
  # каждый в родном размере или ровно кратно ему
  - file: "fonts/PxPlus_HP_100LX_6x8.ttf"
    id: fs
    size: 8
    bpp: 1
    glyphs: &glyphs " !%()+,-./0123456789:;°·≈ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюя═█░▒"
  # em у этого шрифта 16 пикселей (1600 единиц, 100 на пиксель), ячейка 8x14.
  # При size: 14 он сжимался в 0.875 и буквы ломались, родной размер 16.
  - file: "fonts/PxPlus_IBM_VGA_8x14.ttf"
    id: fm
    size: 16
    bpp: 1
    glyphs: *glyphs
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: fb
    size: 16
    bpp: 1
    glyphs: *glyphs
  # экран ALARM: надпись x6 (ячейка 48x96) и цифры отсчета x3 (24x48), только нужные знаки
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: f_alarm
    size: 96
    bpp: 1
    glyphs: "ALRM"
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: f_alarm_num
    size: 48
    bpp: 1
    glyphs: "0123456789"

globals:
  # ---- данные статусов
  - id: g_power
    type: std::vector<float>
    restore_value: no
  - id: g_months
    type: std::vector<float>
    restore_value: no
  - id: g_first_hour
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_days
    type: std::vector<float>
    restore_value: no
  - id: g_first_dow
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_first_day
    type: int
    restore_value: no
    initial_value: '1'
  # ---- журнал событий: 6 строк по 3 поля (время, что, состояние), новая первой; во флеше
  - id: g_log
    type: std::array<std::array<char, 72>, 6>
    restore_value: yes
  - id: g_log_armed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_charging
    type: bool
    restore_value: no
    initial_value: 'false'
  # ---- события 72 часа (72 часовых ведра x 4 дорожки, последнее это
  # текущий час; g_ev_base его номер от эпохи) и время последнего события
  # по дорожке. Во флеше, чтобы перезагрузка не обнуляла ленту.
  - id: g_ev
    type: std::array<uint16_t, 288>
    restore_value: yes
  - id: g_ev_base
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: g_last
    type: std::array<uint32_t, 4>
    restore_value: yes
  # ---- мигание экрана ALARM: идет ли и фаза
  - id: g_flash
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_flash_inv
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Инверсия цветов панели командой, без перерисовки кадра. Нормальное
  # состояние у этой матрицы INVON (0x21), инверсия это INVOFF (0x20).
  # Транзакция как в panel_reinit.
  - id: panel_invert
    parameters:
      inv: bool
    then:
      - lambda: |-
          auto *d = id(lcd);
          d->enable();
          d->write_cmd_addr_data(8, 0x02, 24, (uint32_t) (inv ? 0x20 : 0x21) << 8, nullptr, 0);
          d->disable();

  # Погасить мигание: вернуть нормальные цвета. Зовут касание экрана ALARM и его закрытие.
  - id: flash_stop
    then:
      - lambda: |-
          if (!id(g_flash) && !id(g_flash_inv)) return;
          id(g_flash) = false;
          id(g_flash_inv) = false;
          id(panel_invert).execute(false);
          ESP_LOGI("alarm", "flash stopped");

  # Полная инициализация NV3041A мимо драйвера, удержанием кнопки BOOT: SWRESET,
  # вендорская последовательность модели, PIXFMT, MADCTL 0x00 (родная ориентация),
  # INVON, SLPOUT, DISPON, с паузами 150 мс как у Arduino_GFX (там 120).
  # Транзакция как у драйвера: опкод 0x02, команда во втором байте адреса.
  # Лямбда держит цикл ~330 мс, чтобы кадр не вклинился между командами.
  - id: panel_reinit
    mode: queued
    then:
      - lambda: |-
          auto *d = id(lcd);
          auto cmd = [d](uint8_t c, const uint8_t *data, size_t n) {
            d->enable();
            d->write_cmd_addr_data(8, 0x02, 24, (uint32_t) c << 8, data, n);
            d->disable();
          };
          static const uint8_t VENDOR[][2] = {
            {0xFF,0xA5},{0x41,0x03},{0x44,0x15},{0x45,0x15},{0x7D,0x03},{0xC1,0xBB},
            {0xC2,0x05},{0xC3,0x10},{0xC6,0x3E},{0xC7,0x25},{0xC8,0x11},{0x7A,0x5F},
            {0x6F,0x44},{0x78,0x70},{0xC9,0x00},{0x67,0x21},{0x51,0x0A},{0x52,0x76},
            {0x53,0x0A},{0x54,0x76},{0x46,0x0A},{0x47,0x2A},{0x48,0x0A},{0x49,0x1A},
            {0x56,0x43},{0x57,0x42},{0x58,0x3C},{0x59,0x64},{0x5A,0x41},{0x5B,0x3C},
            {0x5C,0x02},{0x5D,0x3C},{0x5E,0x1F},{0x60,0x80},{0x61,0x3F},{0x62,0x21},
            {0x63,0x07},{0x64,0xE0},{0x65,0x02},{0xCA,0x20},{0xCB,0x52},{0xCC,0x10},
            {0xCD,0x42},{0xD0,0x20},{0xD1,0x52},{0xD2,0x10},{0xD3,0x42},{0xD4,0x0A},
            {0xD5,0x32},{0x80,0x00},{0xA0,0x00},{0x81,0x07},{0xA1,0x06},{0x82,0x02},
            {0xA2,0x01},{0x86,0x11},{0xA6,0x10},{0x87,0x27},{0xA7,0x27},{0x83,0x37},
            {0xA3,0x37},{0x84,0x35},{0xA4,0x35},{0x85,0x3F},{0xA5,0x3F},{0x88,0x0B},
            {0xA8,0x0B},{0x89,0x14},{0xA9,0x14},{0x8A,0x1A},{0xAA,0x1A},{0x8B,0x0A},
            {0xAB,0x0A},{0x8C,0x14},{0xAC,0x08},{0x8D,0x17},{0xAD,0x07},{0x8E,0x16},
            {0xAE,0x06},{0x8F,0x1B},{0xAF,0x07},{0x90,0x04},{0xB0,0x04},{0x91,0x0A},
            {0xB1,0x0A},{0x92,0x16},{0xB2,0x15},{0xFF,0x00},
          };
          const uint8_t zero = 0x00, pixfmt = 0x55, madctl = 0x00;
          cmd(0x01, nullptr, 0);          // SWRESET
          delay(150);
          for (auto &p : VENDOR) cmd(p[0], &p[1], 1);
          cmd(0x3A, &pixfmt, 1);          // 16 бит
          cmd(0x36, &madctl, 1);          // родная ориентация, без поворота
          cmd(0x21, nullptr, 0);          // INVON, пустой командой, как драйвер
          cmd(0x11, &zero, 1);            // SLPOUT
          delay(150);
          cmd(0x29, &zero, 1);            // DISPON
          delay(20);
          ESP_LOGI("panel", "reinit done");

  # Строка журнала событий: время, что, состояние. До g_log_armed (15 с после
  # связи с HA) не пишет: это первые состояния, а не события.
  - id: log_event
    mode: queued
    parameters:
      what: string
      state: string
    then:
      - lambda: |-
          if (!id(g_log_armed)) return;
          auto &L = id(g_log);
          for (int i = 5; i > 0; i--) L[i] = L[i - 1];
          auto t = id(homeassistant_time).now();
          char ts[16];
          if (t.is_valid()) snprintf(ts, sizeof ts, "%02d.%02d %02d:%02d", t.day_of_month, t.month, t.hour, t.minute);
          else snprintf(ts, sizeof ts, "--.-- --:--");
          snprintf(L[0].data(), L[0].size(), "%s|%s|%s", ts, what.c_str(), state.c_str());
          id(g_log) = L;   // запись во флеш

  # Зарядка по мощности выбранной линии, с гистерезисом 300/100 Вт
  - id: check_charge
    then:
      - lambda: |-
          bool sockets = id(ha_line).state == "Розетки гаража";
          float p = sockets ? id(ha_p_sock).state : id(ha_p_chg).state;
          if (std::isnan(p)) return;
          if (!id(g_charging) && p > 300) { id(g_charging) = true; id(log_event).execute("ЗАРЯДКА", "старт"); }
          else if (id(g_charging) && p < 100) { id(g_charging) = false; id(log_event).execute("ЗАРЯДКА", "стоп"); }

  # Данные из HA в интерфейс
  - id: gs_refresh
    then:
      - lambda: |-
          gs::State st;
          st.gate_open = id(ha_gate).state;
          st.motion = id(ha_motion).state;
          st.light_on = id(ha_light).state == "on";
          st.lock = id(ha_lock).state;
          st.alarm = id(ha_alarm).state;
          st.charge_on = id(ha_chg_sw).state == "on";
          float lt = id(ha_light_to).state;
          st.light_timeout = std::isnan(lt) ? 5 : (int) lroundf(lt);
          st.p_now = id(ha_p_now).state;
          st.volt = id(ha_volt).state;
          st.p_chg = id(ha_line).state == "Розетки гаража" ? id(ha_p_sock).state : id(ha_p_chg).state;
          st.d_sock = id(ha_d_sock).state;
          st.d_light = id(ha_d_light).state;
          st.d_chg = id(ha_d_chg).state;
          st.m_sock = id(ha_m_sock).state;
          st.m_light = id(ha_m_light).state;
          st.m_chg = id(ha_m_chg).state;
          st.sched_on = id(ha_chg_on).state == "on";
          auto hm = [](const std::string &v, const char *def) { return v.size() >= 5 ? v.substr(0, 5) : std::string(def); };
          st.sched_start = hm(id(ha_chg_start).state, "23:00");
          st.sched_end = hm(id(ha_chg_end).state, "07:00");
          st.line_name = id(ha_line).state;
          st.now = id(homeassistant_time).now();
          st.time_ok = st.now.is_valid();
          gs::H_POWER = id(g_power);
          gs::H_MONTHS = id(g_months);
          gs::H_DAYS = id(g_days);
          gs::H_FIRST_HOUR = id(g_first_hour);
          gs::refresh(st);

  # событие в ленту статусов (после загрузки, первые состояния не события)
  - id: gs_event
    mode: queued
    parameters:
      lane: int
    then:
      - lambda: |-
          if (!id(g_log_armed)) return;
          auto t = id(homeassistant_time).now();
          if (!t.is_valid()) return;
          gs::ev_live(lane, t.timestamp);

  # команды касаний статусов; нужен allow_service_calls у платы в HA
  - id: gs_charge
    then:
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.zariadka_avto
  - id: gs_light
    then:
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: switch.svet_garazh
  # Замок: команды toggle у lock в HA нет, выбираем по состоянию. Код panel в
  # input_text.garage_lock_source подписывает уведомление «с панели в гараже».
  # Закрытие при открытых воротах откатит garage_lock_guard_gate_open в HA.
  - id: gs_lock
    then:
      - if:
          condition:
            lambda: 'return id(ha_lock).state == "locked" || id(ha_lock).state == "unlocked";'
          then:
            - homeassistant.action:
                action: input_text.set_value
                data:
                  entity_id: input_text.garage_lock_source
                  value: !lambda 'return "panel|" + to_string(id(homeassistant_time).now().timestamp);'
            - if:
                condition:
                  lambda: 'return id(ha_lock).state == "locked";'
                then:
                  - homeassistant.action:
                      action: lock.unlock
                      data:
                        entity_id: lock.door_lock_garage
                else:
                  - homeassistant.action:
                      action: lock.lock
                      data:
                        entity_id: lock.door_lock_garage
  - id: gs_arm
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_away
          data:
            entity_id: alarm_control_panel.garazh_okhrana
  - id: gs_disarm
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_disarm
          data:
            entity_id: alarm_control_panel.garazh_okhrana

lvgl:
  id: lvgl_comp
  displays: [lcd]
  touchscreens: [ts]
  buffer_size: 25%
  default_font: fs
  # Цвет подписей по умолчанию светлый. Без него подписи внутри панелей берут
  # темный цвет карточки из штатной темы LVGL.
  theme:
    obj:
      pad_all: 0
      border_width: 0
      radius: 0
      bg_opa: TRANSP
      scrollbar_mode: "OFF"
      scrollable: false
    label:
      text_color: 0xe6ecff
    bar:
      pad_all: 0
      scrollable: false
  pages:
    # статусы: пустая страница, все виджеты строит gs::init (garage_status_ui.h)
    - id: p_status
      bg_opa: COVER
      bg_color: 0x000000
      scrollable: false
      widgets:
        # Скрытый холст 1x1 держит LV_USE_CANVAS в сборке: ESPHome включает
        # холст в lv_conf только при canvas в YAML, а статусы рисуют холстами
        # из C++. Без него сборка падает (lv_canvas_create не объявлен).
        - canvas:
            id: gs_keep_canvas
            x: 0
            y: 0
            width: 1
            height: 1
            hidden: true
