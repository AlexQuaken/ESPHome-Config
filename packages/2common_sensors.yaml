sensor:
  - platform: uptime
    name: ${board_name}_Uptime_s
    id: uptime_sensor
    update_interval: ${update_interval}

  - platform: wifi_signal
    name: ${board_name}_WiFi_RSSI
    id: wifis_signal
    update_interval: ${update_interval}
    filters:
      - delta: 3

switch:
  - platform: restart
    name: ${board_name}_Restart

text_sensor:
  - platform: template
    name: ${board_name}_Uptime
    lambda: |-
      // ЧЧЧ:ММ:СС, часы без деления на сутки, с нулями до трех знаков
      uint32_t dur = id(uptime_sensor).state;
      char buffer[24];
      snprintf(buffer, sizeof(buffer), "%03u:%02u:%02u", (unsigned) (dur / 3600), (unsigned) (dur % 3600 / 60), (unsigned) (dur % 60));
      return {buffer};
    icon: mdi:clock-start
    update_interval: ${update_interval}

  - platform: template
    name: ${board_name} WiFi Strength
    icon: "mdi:wifi"
    lambda: |-
      if (id(wifis_signal).state > -45 ) {
        return {"Excellent"};
      } else if (id(wifis_signal).state > -55) {
        return {"Very good"};
      } else if (id(wifis_signal).state > -65) {
        return {"Good"};
      } else if (id(wifis_signal).state > -75) {
        return {"Low"};   
      } else if (id(wifis_signal).state > -85) {
        return {"Very low"};
      } else if (id(wifis_signal).state < -95) {
        return {"No signal"};
      } else {
        return {"None"};
      }
    update_interval: ${update_interval}

time:
  - platform: homeassistant
    id: homeassistant_time
