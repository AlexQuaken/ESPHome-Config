# Одна батарея для battair-monitor.yaml: подключается в список batteries через
#   - !include {file: packages/battair_bat.yaml, vars: {n: 1, ble: 'BattAir 1', mac: ''}}
# Каждая батарея отдельное подустройство bat<n>_dev (объявлены в esphome: devices:),
# в HA это устройство "BattAir <n>" с сущностями "Cell 1", "Voltage" и т. д.
# Entity_id в HA оставлены старыми, sensor.battair_monitor_bat<n>_...: на них завязаны
# уведомления о напряжении и разбалансе, Awtrix, экран esp32-cam1 и дашборды.
ble_name: ${ble}
mac_address: ${mac}
label:
  name: Name
  device_id: bat${n}_dev
type:
  name: Type
  device_id: bat${n}_dev
cycles:
  name: Cycles
  device_id: bat${n}_dev
voltage:
  name: Voltage
  device_id: bat${n}_dev
cell_1:
  name: Cell 1
  device_id: bat${n}_dev
cell_2:
  name: Cell 2
  device_id: bat${n}_dev
cell_3:
  name: Cell 3
  device_id: bat${n}_dev
cell_4:
  name: Cell 4
  device_id: bat${n}_dev
cell_delta:
  name: Cell Delta
  device_id: bat${n}_dev
temperature:
  name: Temperature
  device_id: bat${n}_dev
charge_current:
  name: Charge Current
  device_id: bat${n}_dev
discharge_current:
  name: Discharge Current
  device_id: bat${n}_dev
level:
  name: Level
  device_id: bat${n}_dev
rssi:
  name: RSSI
  device_id: bat${n}_dev
online:
  name: Online
  device_id: bat${n}_dev
firmware:
  name: Firmware
  device_id: bat${n}_dev
errors:
  name: Errors
  device_id: bat${n}_dev
outages:
  name: Outages
  device_id: bat${n}_dev
overheats:
  name: Overheats
  device_id: bat${n}_dev
overcharges:
  name: Overcharges
  device_id: bat${n}_dev
overdischarges:
  name: Overdischarges
  device_id: bat${n}_dev
