# BLE-монитор аккумулятора BM6 (Ancel BM200 и прочие клоны). Подключение:
#   bm6_moto: !include {file: packages/bm6_battery.yaml, vars: {key: bm6_moto, dev: ktm_dev, label: Battery, mac: '3C:AB:72:CB:01:6C', period_ms: '3600000'}}
# dev это id подустройства (заводит тот, кто подключает), label приставка к именам
# сущностей, period_ms период опроса в миллисекундах.
# В эфире датчик зовется BM6 и рекламирует только iBeacon, данных в рекламе нет.
# Поэтому раз в period_ms (при срыве повтор через 30 с) плата подключается,
# пишет команду в FFF3, ловит первое
# уведомление FFF4 и сразу отключается. Расшифровка в bm6.h.
#
# Соединение у датчика одно. Пока держит телефон с приложением Ancel, плата не
# подключится, и наоборот, но плата висит на связи секунды раз в period_ms.
#
# Процент заряда и состояние датчик считает сам, и на BM200 они странные (0 % и
# «низкое» при 13,17 В), поэтому оба идут диагностикой. Свою оценку заряда под
# конкретную химию делает тот, кто подключает пакет (см. moto_screen.yaml).
esphome:
  includes:
    - bm6.h

globals:
  # Когда датчик последний раз был слышен в эфире. Подключаться без этого нельзя:
  # ble_client.connect к датчику, которого нет рядом, висит в ожидании рекламы.
  - id: ${key}_seen_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Когда последний раз опрос прошел до конца, 0 пока ни разу
  - id: ${key}_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

esp32_ble_tracker:
  on_ble_advertise:
    - mac_address: ${mac}
      then:
        - lambda: 'id(${key}_seen_ms) = millis();'

ble_client:
  - id: ${key}
    mac_address: ${mac}
    auto_connect: false
    on_connect:
      then:
        # секунда на подписку уведомлений после поиска служб
        - delay: 1s
        - ble_client.ble_write:
            id: ${key}
            service_uuid: fff0
            characteristic_uuid: fff3
            value: !lambda return bm6::CMD;
        # ответ приходит сразу, это страховка, если он потерялся
        - delay: 20s
        - ble_client.disconnect: ${key}

script:
  # Опрос, если датчик рядом и клиент свободен. Зовут интервал ниже и, чаще,
  # экран мотоцикла, пока хозяин в гараже.
  #
  # Подключение прямым вызовом, а не действием ble_client.connect: действие ждет
  # установления связи и после ошибки (status=133, бывает, когда связь держит
  # телефон) не завершается никогда. Скрипт тогда навсегда «уже запущен», и опрос
  # умирает до перезагрузки. Так было при первой прошивке 12.10.2026.
  - id: ${key}_poll
    then:
      - lambda: |-
          if (id(${key}).state() != esp32_ble_tracker::ClientState::IDLE) return;
          if (id(${key}_seen_ms) == 0 || millis() - id(${key}_seen_ms) > 60000) return;
          id(${key}).connect();

interval:
  # Раз в period_ms, а если опрос сорвался, повтор каждые 30 с. Срывается часто:
  # связь на -75...-80 dBm, и первая попытка нередко кончается status=133.
  - interval: 30s
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: 'return id(${key}_ok_ms) == 0 || millis() - id(${key}_ok_ms) > ${period_ms};'
          then:
            - script.execute: ${key}_poll

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: ${key}
    id: ${key}_raw
    internal: true
    service_uuid: fff0
    characteristic_uuid: fff4
    notify: true
    update_interval: never
    lambda: |-
      float v, t, s;
      int st;
      if (!bm6::decode(x, v, t, s, st)) return NAN;
      id(${key}_ok_ms) = millis();
      // температура раньше напряжения: подписчики напряжения берут ее свежей
      id(${key}_t).publish_state(t);
      id(${key}_soc).publish_state(s);
      id(${key}_state).publish_state(st);
      id(${key}_v).publish_state(v);
      id(${key}).disconnect();
      return v;

  - platform: template
    id: ${key}_v
    name: ${label} voltage
    device_id: ${dev}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    # повтор того же значения иначе в HA не пишется, и не видно, жив ли опрос
    force_update: true

  - platform: template
    id: ${key}_t
    name: ${label} temperature
    device_id: ${dev}
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: ${key}_soc
    name: ${label} monitor charge
    device_id: ${dev}
    unit_of_measurement: '%'
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  # 0 норма, 1 низкое напряжение, 2 зарядка
  - platform: template
    id: ${key}_state
    name: ${label} monitor state
    device_id: ${dev}
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  # Сила сигнала по рекламе, усредненная за 5 минут: видно, слышит ли плата датчик
  - platform: ble_rssi
    mac_address: ${mac}
    name: ${label} monitor RSSI
    device_id: ${dev}
    entity_category: diagnostic
    filters:
      - throttle_average: 5min
