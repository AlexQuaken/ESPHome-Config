# Диагностика сбоев: почему плата перезагрузилась и сколько раз не смогла подняться.
#
# Подключается одной строкой в packages: платы:
#   diag: !include packages/diag.yaml
#
# Что отдает в HA:
#   Reset Reason    причина последнего старта: power-on, brownout, watchdog, panic, software
#   Failed Boots    сколько загрузок подряд перед этой не дошли до HA; если плата крутилась
#                   в перезагрузке раньше Wi-Fi, здесь будет число этих попыток
#   Prev Uptime     сколько прожила прошлая загрузка, с точностью до минуты
#   Total Boots     сколько раз плата стартовала за всю жизнь пакета
#   WiFi Drops      обрывов Wi-Fi с последнего старта
#
# Почему счетчики пишутся вручную через global_preferences, а не через globals
# с restore_value. Globals сбрасываются во флеш не сразу, а раз в flash_write_interval
# (минута по умолчанию). Плата, которая падает по brownout через три секунды после
# старта, до этой записи не доживает, и счетчик неудачных загрузок навсегда стоял бы
# на нуле. Поэтому на старте значение пишется во флеш немедленно, с sync(), и
# происходит это на приоритете 800, то есть до подъема Wi-Fi, который и дает
# главный бросок тока.
#
# Failed Boots считает удачной загрузку, дошедшую до API HA. Если в это время лежал
# сам HA, счетчик тоже вырастет, это надо держать в голове при чтении.
#
# Износ флеша: одна запись на загрузку плюс аптайм раз в минуту, около полумиллиона
# записей в год. NVS размазывает их по страницам, и раздел выдерживает десятки
# миллионов таких записей, так что на жизнь платы это не влияет.

# ID платы берется из подстановки number файла устройства. У кого ее нет, будет
# пусто: подстановки из файла устройства перекрывают эту, а эта нужна только чтобы
# пакет собирался на платах без number.
substitutions:
  number: ''
  # номер для таблицы; по умолчанию number, но его можно переопределить отдельно,
  # не трогая number, который вшит в имена BLE-сенсоров платы
  board_id: ${number}
  # 'false' выключает запись аптайма во флеш раз в минуту, Prev Uptime тогда всегда 0.
  # Заведено для esp32cam-3s-24: она 28.09.2026 стала падать по interrupt watchdog, и
  # с частой записью падала чаще. Но падала и совсем без пакета, так что это не причина.
  diag_save_uptime: 'true'

globals:
  - id: diag_failed_before
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: diag_prev_uptime
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: diag_total_boots
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: diag_wifi_drops
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: diag_reported
    type: bool
    restore_value: no
    initial_value: 'false'

# on_boot списком, а не словарем. При слиянии пакета с файлом устройства словарь
# против словаря сливается в одну автоматизацию с приоритетом из файла устройства,
# а список против словаря просто затирается. Только список против списка дает две
# отдельные автоматизации, каждую со своим приоритетом. Поэтому у плат со своим
# on_boot он тоже должен быть записан списком.
#
# Второй аргумент true у make_preference: на ESP8266 без него значение ляжет в
# RTC-память и пропадет при обесточивании. На ESP32 он ничего не меняет, там всегда NVS.
#
# Приоритет 800: раньше всех железных компонентов и задолго до Wi-Fi.
esphome:
  on_boot:
    - priority: 800
      then:
      - lambda: |-
          auto p_att = global_preferences->make_preference<uint32_t>(fnv1_hash("diag_att"), true);
          auto p_tot = global_preferences->make_preference<uint32_t>(fnv1_hash("diag_tot"), true);
          auto p_up  = global_preferences->make_preference<uint32_t>(fnv1_hash("diag_up"), true);
          uint32_t att = 0, tot = 0, up = 0;
          p_att.load(&att);
          p_tot.load(&tot);
          p_up.load(&up);
          // att это загрузки с момента последнего выхода в HA; каждая удачная его обнуляет,
          // значит сейчас в нем ровно число неудачных стартов перед этим
          id(diag_failed_before) = att;
          id(diag_prev_uptime) = up;
          id(diag_total_boots) = tot + 1;
          att += 1;
          tot += 1;
          up = 0;
          p_att.save(&att);
          p_tot.save(&tot);
          p_up.save(&up);
          global_preferences->sync();
          ESP_LOGI("diag", "boot #%u, failed before: %u, prev uptime: %us",
                   (unsigned) tot, (unsigned) id(diag_failed_before), (unsigned) id(diag_prev_uptime));

api:
  on_client_connected:
    - lambda: |-
        // HA переподключается сам по себе, обнулять счетчик надо один раз за загрузку
        if (id(diag_reported)) return;
        id(diag_reported) = true;
        auto p_att = global_preferences->make_preference<uint32_t>(fnv1_hash("diag_att"), true);
        uint32_t zero = 0;
        p_att.save(&zero);
        global_preferences->sync();

wifi:
  on_disconnect:
    - lambda: 'id(diag_wifi_drops) += 1;'

interval:
  # Аптайм во флеш раз в минуту: после сбоя видно, сколько плата прожила, с точностью
  # до минуты. Первый запуск идет сразу после старта и пишет 0-1 с, поэтому
  # Prev Uptime около нуля значит «прожила меньше минуты».
  # millis() переполняется через 49.7 суток, для этой цели точности хватает.
  - interval: 1min
    then:
      - lambda: |-
          if (!${diag_save_uptime}) return;
          auto p_up = global_preferences->make_preference<uint32_t>(fnv1_hash("diag_up"), true);
          uint32_t up = millis() / 1000;
          p_up.save(&up);

# Причина сброса читается напрямую, без компонента debug. С debug на классическом
# ESP32 переставали работать камеры: esp32_camera Setup Failed: ESP_ERR_NOT_SUPPORTED
# на cam1 и cam2. Проверено 28.09.2026 на cam1: без пакета камера работает, с пакетом
# и debug нет, с пакетом без debug снова работает. Сдвиг on_boot на 800 не помогал.
# На ESP8266 esp_reset_reason() нет, там причину отдает ESP.getResetReason().
text_sensor:
  - platform: template
    name: ${board_name} Reset Reason
    entity_category: diagnostic
    update_interval: 1h
    lambda: |-
      #ifdef USE_ESP32
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:   return {"power-on"};
        case ESP_RST_BROWNOUT:  return {"brownout"};
        case ESP_RST_SW:        return {"software"};
        case ESP_RST_PANIC:     return {"panic"};
        case ESP_RST_INT_WDT:   return {"interrupt watchdog"};
        case ESP_RST_TASK_WDT:  return {"task watchdog"};
        case ESP_RST_WDT:       return {"watchdog"};
        case ESP_RST_DEEPSLEEP: return {"deep sleep"};
        case ESP_RST_EXT:       return {"external pin"};
        default:                return {"unknown"};
      }
      #else
      return {ESP.getResetReason().c_str()};
      #endif
  # номер платы для таблицы на дашборде
  - platform: template
    name: ${board_name} Board ID
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return {"${board_id}"};'

sensor:
  - platform: template
    name: ${board_name} Failed Boots
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: 'return id(diag_failed_before);'
  - platform: template
    name: ${board_name} Prev Uptime
    entity_category: diagnostic
    device_class: duration
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(diag_prev_uptime);'
  - platform: template
    name: ${board_name} Total Boots
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: 'return id(diag_total_boots);'
  - platform: template
    name: ${board_name} WiFi Drops
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: 'return id(diag_wifi_drops);'
