# t-display-s3-23 — LilyGO T-Display-S3 (ESP32-S3 + ST7789 i80 320x170)
# BLE radar + log console. Лог-режим первые 60s, после авто → radar.
#
# С 23.08.2026 — нативный драйвер: display platform mipi_spi, model T-DISPLAY-S3
# (octal/i80 шина в core ESPHome). Раньше стоял external_component tdisplays3
# поверх TFT_eSPI и framework: arduino; ESPHome 2026.8.0 собирает Arduino-код
# через ESP-IDF toolchain, и TFT_eSPI под ним не компилируется.
#
# Кнопки на плате: BOOT=GPIO0, KEY=GPIO14 — KEY используется для ручного
# переключения log/radar (toggle id(display_mode)).
substitutions:
  board_name: 't-display-s3-23'
  static_ip: '192.168.0.218'
  number: '21'

esphome:
  name: ${board_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(log_lines).push_back("${board_name} booted");
          id(log_lines).push_back("display OK");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_CDC

web_server:
  port: 80
  version: 3
  local: true

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    name: ${board_name} KEY
    id: btn_key
    on_click:
      then:
        - lambda: |-
            id(display_mode) = id(display_mode) == 0 ? 1 : 0;
            id(radar_mode_sw).publish_state(id(display_mode) == 1);

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml
  base_sensors: !include packages/2common_sensors.yaml
  ble_common: !include packages/ble_common.yaml
  ble_alex: !include packages/ble_alex.yaml
  ble_ira: !include packages/ble_ira.yaml
  ble_lila: !include packages/ble_lila.yaml
  ble_radar: !include packages/ble_radar_tdisplay_s3.yaml

# Яркость экрана по датчику освещенности в кабинете (zigbee, Кабинет_illuminance =
# sensor.0x04cf8cdf3c789feb_illuminance). Темно, значит 30%, светло, значит 100%.
# Ночного гашения по расписанию нет, экран не выключается совсем.
#
# Значение приходит из HA, но решение принимает сама плата: пришла новая цифра,
# ESP пересчитала яркость. Отдельной автоматизации в HA под это нет.
#
# Пороги разведены (1 и 4 лк) специально. Датчик в сумерках дребезжит между 1 и 2,
# и на одном общем пороге экран мигал бы туда-сюда при каждом обновлении.
# Между 1 и 4 держим то, что стоит сейчас.
#
# Выключенную подсветку не трогаем: погасил кнопкой в HA, значит погашено,
# яркость подхватится при следующем обновлении датчика уже после включения.
sensor:
  - platform: homeassistant
    id: kabinet_lux
    entity_id: sensor.0x04cf8cdf3c789feb_illuminance
    internal: true
    on_value:
      then:
        - if:
            condition:
              light.is_on: backlight
            then:
              - lambda: |-
                  bool dim = id(backlight_dimmed);
                  if (x <= 1.0f) dim = true;
                  else if (x >= 4.0f) dim = false;
                  // Уже в нужном режиме — не перебиваем яркость, выставленную руками
                  if (id(backlight_applied) && dim == id(backlight_dimmed)) return;
                  id(backlight_dimmed) = dim;
                  id(backlight_applied) = true;
                  auto call = id(backlight).turn_on();
                  call.set_brightness(dim ? 0.30f : 1.0f);
                  call.set_transition_length(1000);
                  call.perform();
                  ESP_LOGI("backlight", "lux=%.0f -> %s", x, dim ? "30%" : "100%");

globals:
  # Текущий режим яркости и признак, что он хоть раз применялся после загрузки
  - id: backlight_dimmed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: backlight_applied
    type: bool
    restore_value: false
    initial_value: 'false'
