# t-display-s3-23 — LilyGO T-Display-S3 (ESP32-S3 + ST7789 i80 320x170)
# BLE radar + log console. Лог-режим первые 60s, после авто → radar.
#
# С 23.08.2026 — нативный драйвер: display platform mipi_spi, model T-DISPLAY-S3
# (octal/i80 шина в core ESPHome). Раньше стоял external_component tdisplays3
# поверх TFT_eSPI и framework: arduino; ESPHome 2026.8.0 собирает Arduino-код
# через ESP-IDF toolchain, и TFT_eSPI под ним не компилируется.
#
# Кнопки на плате: BOOT=GPIO0, KEY=GPIO14 — KEY листает режимы по кругу:
# 0 лог, 1 BLE-радар, 2 часы.
#
# Часы это режим по умолчанию и постоянный. Лог сам показывается на 30 секунд
# при открытии двери гаража, с часами бледно-фиолетовой подложкой, и возвращается
# в часы. Радар автоматически не показывается вовсе, только кнопкой.
substitutions:
  board_name: 't-display-s3-23'
  static_ip: '192.168.17.218'
  number: '21'

# Переезд в гараж 2, 19.09.2026. Плата уходит на точку Garage54 (сегмент
# 192.168.17.0/24), а не на гостевую SmartHome: гостевая скрытая, и при
# fast_connect: false из общего пакета ESPHome ее сканированием не найдет.
# Плюс единственный клиент гостевой это шлюз-динамик 192.168.18.113, на котором
# держится вся озвучка гаража, и трогать ту сеть незачем.
#
# Блок ниже перебивает значения из packages/1wifi_api_ota_logger.yaml: там
# прописаны домашний SSID и шлюз 192.168.0.1, с которыми плата в гараже
# ассоциировалась бы и тут же пропадала.
#
# Из дома плата доступна через туннель, как и оба гаражных шлюза. mDNS туда не
# ходит, поэтому в панели ESPHome она будет числиться офлайн, а OTA давать
# явным адресом: esphome upload --device 192.168.17.218
wifi:
  networks:
    ssid: Garage54
    password: !secret garage_wifipwd
  manual_ip:
    static_ip: ${static_ip}
    gateway: 192.168.17.1
    subnet: 255.255.255.0
    # Первым роутер гаража: домашний DNS живет только пока стоит туннель
    dns1: 192.168.17.1
    dns2: 192.168.0.7

esphome:
  name: ${board_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(log_lines).push_back("${board_name} booted");
          id(log_lines).push_back("display OK");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_CDC

web_server:
  port: 80
  version: 3
  local: true

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    name: ${board_name} KEY
    id: btn_key
    on_click:
      then:
        - lambda: |-
            // 0 лог -> 1 радар -> 2 часы -> снова лог
            id(display_mode) = (id(display_mode) + 1) % 3;
            id(radar_mode_sw).publish_state(id(display_mode) == 1);

  # Дверь гаража приезжает из HA. Решение принимает сама плата, отдельной
  # автоматизации в HA под это нет: меньше звеньев, которые могут отвалиться.
  - platform: homeassistant
    id: garage2_door_remote
    entity_id: binary_sensor.garage2_door
    internal: true
    on_press:
      then:
        - script.execute: show_log_burst

script:
  # Открылась дверь: показываем лог на 30 секунд и возвращаемся в часы.
  # mode: restart — если дверь открыли снова, окно начинается заново, а не
  # копится вторым прогоном поверх первого.
  - id: show_log_burst
    mode: restart
    then:
      - lambda: |-
          auto t = id(homeassistant_time).now();
          char b[48];
          if (t.is_valid())
            snprintf(b, sizeof(b), "%02d:%02d:%02d DOOR OPEN", t.hour, t.minute, t.second);
          else
            snprintf(b, sizeof(b), "DOOR OPEN");
          id(log_lines).push_back(std::string(b));
          id(display_mode) = 0;
          id(radar_mode_sw).publish_state(false);
      - delay: 30s
      - lambda: 'id(display_mode) = 2;'

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml
  base_sensors: !include packages/2common_sensors.yaml
  ble_common: !include packages/ble_common.yaml
  ble_alex: !include packages/ble_alex.yaml
  ble_ira: !include packages/ble_ira.yaml
  ble_lila: !include packages/ble_lila.yaml
  ble_radar: !include packages/ble_radar_tdisplay_s3.yaml

# Яркость экрана по датчику освещенности гаража 2 (sensor.garage2_illuminance).
# Темно, значит 30%, светло, значит 100%. До переезда 19.09.2026 тут был
# кабинетный датчик, после переезда он к этой плате отношения не имеет.
# Ночного гашения по расписанию нет, экран не выключается совсем.
#
# Значение приходит из HA, но решение принимает сама плата: пришла новая цифра,
# ESP пересчитала яркость. Отдельной автоматизации в HA под это нет.
#
# Пороги разведены (1 и 4 лк) специально. Датчик в сумерках дребезжит между 1 и 2,
# и на одном общем пороге экран мигал бы туда-сюда при каждом обновлении.
# Между 1 и 4 держим то, что стоит сейчас.
#
# Выключенную подсветку не трогаем: погасил кнопкой в HA, значит погашено,
# яркость подхватится при следующем обновлении датчика уже после включения.
sensor:
  - platform: homeassistant
    id: kabinet_lux
    entity_id: sensor.garage2_illuminance
    internal: true
    on_value:
      then:
        - if:
            condition:
              light.is_on: backlight
            then:
              - lambda: |-
                  bool dim = id(backlight_dimmed);
                  if (x <= 1.0f) dim = true;
                  else if (x >= 4.0f) dim = false;
                  // Уже в нужном режиме — не перебиваем яркость, выставленную руками
                  if (id(backlight_applied) && dim == id(backlight_dimmed)) return;
                  id(backlight_dimmed) = dim;
                  id(backlight_applied) = true;
                  auto call = id(backlight).turn_on();
                  call.set_brightness(dim ? 0.30f : 1.0f);
                  call.set_transition_length(1000);
                  call.perform();
                  ESP_LOGI("backlight", "lux=%.0f -> %s", x, dim ? "30%" : "100%");

globals:
  # Текущий режим яркости и признак, что он хоть раз применялся после загрузки
  - id: backlight_dimmed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: backlight_applied
    type: bool
    restore_value: false
    initial_value: 'false'
