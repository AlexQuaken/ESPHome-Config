# t-display-s3-23 — LilyGO T-Display-S3 (ESP32-S3 + ST7789 i80 320x170)
# BLE radar + log console. Лог-режим первые 60s, после авто → radar.
#
# С 23.08.2026 — нативный драйвер: display platform mipi_spi, model T-DISPLAY-S3
# (octal/i80 шина в core ESPHome). Раньше стоял external_component tdisplays3
# поверх TFT_eSPI и framework: arduino; ESPHome 2026.8.0 собирает Arduino-код
# через ESP-IDF toolchain, и TFT_eSPI под ним не компилируется.
#
# Кнопки на плате: BOOT=GPIO0, KEY=GPIO14 — KEY используется для ручного
# переключения log/radar (toggle id(display_mode)).
substitutions:
  board_name: 't-display-s3-23'
  static_ip: '192.168.0.218'
  number: '21'

esphome:
  name: ${board_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(log_lines).push_back("${board_name} booted");
          id(log_lines).push_back("display OK");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_CDC

web_server:
  port: 80
  version: 3
  local: true

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    name: ${board_name} KEY
    id: btn_key
    on_click:
      then:
        - lambda: |-
            id(display_mode) = id(display_mode) == 0 ? 1 : 0;
            id(radar_mode_sw).publish_state(id(display_mode) == 1);

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml
  base_sensors: !include packages/2common_sensors.yaml
  ble_common: !include packages/ble_common.yaml
  ble_alex: !include packages/ble_alex.yaml
  ble_ira: !include packages/ble_ira.yaml
  ble_lila: !include packages/ble_lila.yaml
  ble_radar: !include packages/ble_radar_tdisplay_s3.yaml

# Ночной режим экрана: 23:30 гасим подсветку, 07:00 зажигаем.
# Расписание живет внутри самой ESP (time.on_time), автоматизаций в HA нет.
# Время приходит от HA один раз при синхронизации (time platform homeassistant,
# id homeassistant_time объявлен в packages/2common_sensors.yaml), дальше плата
# ведет часы сама, поэтому триггер отработает и при недоступном HA.
# !extend дописывает триггеры в компонент из пакета, второго времени не заводит.
time:
  - id: !extend homeassistant_time
    on_time:
      # Отбой
      - seconds: 0
        minutes: 30
        hours: 23
        then:
          - light.turn_off: backlight
      # Подъем. Яркость не задаем, берется последняя выставленная в HA
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - light.turn_on: backlight
    # После ребута restore_mode: RESTORE_DEFAULT_ON зажжет экран даже ночью.
    # Один раз, на первой синхронизации времени, приводим состояние к расписанию.
    # Дальше не вмешиваемся, иначе ручное включение ночью гасло бы само.
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return !id(night_schedule_checked);'
            then:
              - lambda: 'id(night_schedule_checked) = true;'
              - if:
                  condition:
                    lambda: |-
                      auto t = id(homeassistant_time).now();
                      if (!t.is_valid()) return false;
                      return (t.hour == 23 && t.minute >= 30) || t.hour < 7;
                  then:
                    - light.turn_off: backlight

globals:
  # Флаг живет только до перезагрузки, restore_value: false
  - id: night_schedule_checked
    type: bool
    restore_value: false
    initial_value: 'false'
