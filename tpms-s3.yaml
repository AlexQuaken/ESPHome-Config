    hex: '000000'
  - id: c_tile
    hex: '14181C'
  - id: c_ok
    hex: '3CF07A'
  - id: c_text
    hex: 'D8DEE4'
  - id: c_dim
    hex: '7A848E'
  - id: c_grey
    hex: '4A525A'
  - id: c_red
    hex: 'E0242A'
  - id: c_darkred
    hex: '5A0E10'
  - id: c_amber
    hex: 'FFB000'
  - id: c_white
    hex: 'FFFFFF'
  - id: c_ktm
    hex: 'FF6600'
  - id: c_spark
    hex: '1F5A35'
  - id: c_thr
    hex: '7A1C1E'
  - id: c_grid
    hex: '4A2408'

display:
  - platform: mipi_spi
    model: T-DISPLAY-S3
    id: lcd
    spi_id: display_bus
    # 320x170. С 04.10.2026 перевернуто на 180 по просьбе юзера: USB-разъем
    # справа. Вернуть как было: 270.
    rotation: 90
    data_rate: 20MHz
    update_interval: 100ms
    lambda: |-
      number::Number *L[4] = {id(lo0), id(lo1), id(lo2), id(lo3)};
      number::Number *H[4] = {id(hi0), id(hi1), id(hi2), id(hi3)};
      const char *NAME[4] = {"${name_0}", "${name_1}", "${name_2}", "${name_3}"};
      const uint32_t stale = ${stale_min} * 60000UL;
      const uint32_t now = millis();
      const bool blink = (now / 400) % 2;
      it.fill(id(c_bg));

      // ---------------------------------------------------------- загрузка
      if (!id(boot_done)) {
        if (id(boot_t0) == 0) id(boot_t0) = now ? now : 1;
        const uint32_t el = now - id(boot_t0);
        if (el > tpms::BOOT_TOTAL_MS) {
          id(boot_done) = true;
        } else {
          tpms::BootCtx c;
          c.on_air = 0;
          for (int i = 0; i < tpms::N; i++) {
            c.lo[i] = L[i]->state;
            c.hi[i] = H[i]->state;
            if (tpms::W[i].seen) c.on_air++;
          }
          c.wifi_up = wifi::global_wifi_component->is_connected();
          c.ip = "${static_ip}";
          c.heap_kb = heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024;
          c.psram_kb = heap_caps_get_total_size(MALLOC_CAP_SPIRAM) / 1024;
          int shown = 0;
          while (tpms::boot_at(shown) <= el && shown < 64) {
            char t[48];
            if (tpms::boot_line(shown, c, t, sizeof(t)) == tpms::B_END) break;
            shown++;
          }
          // На экран влезает 12 строк по 14 px, старые уезжают вверх.
          const int first = shown > 12 ? shown - 12 : 0;
          int y = 0;
          for (int k = first; k < shown; k++, y += 14) {
            char t[48];
            const int st = tpms::boot_line(k, c, t, sizeof(t));
            const float ts = tpms::boot_at(k) / 1000.0f + (k * 37 % 100) / 10000.0f;
            switch (st) {
              case tpms::B_HEAD:
                it.print(0, y, id(f_con), id(c_ktm), t);
                break;
              case tpms::B_OK:
                it.print(0, y, id(f_con), id(c_dim), "[");
                it.print(8, y, id(f_con), id(c_ok), "  OK  ");
                it.print(56, y, id(f_con), id(c_dim), "]");
                it.print(72, y, id(f_con), id(c_text), t);
                break;
              case tpms::B_WARN:
                it.print(0, y, id(f_con), id(c_dim), "[");
                it.print(8, y, id(f_con), id(c_amber), " WARN ");
                it.print(56, y, id(f_con), id(c_dim), "]");
                it.print(72, y, id(f_con), id(c_amber), t);
                break;
              default:
                it.printf(0, y, id(f_con), id(c_dim), "[%6.3f]", ts);
                it.print(72, y, id(f_con), id(c_text), t);
            }
          }
          // Курсор под последней строкой, как в терминале.
          if (blink && y < 170 - 14) it.print(0, y, id(f_con), id(c_ktm), "_");
          return;
        }
      }

      // Рисует историю датчика i в прямоугольнике. pts точек от свежей назад.
      // thr: шкала включает пороги и они рисуются линиями. Возвращает шкалу.
      auto graph = [&](int i, int gx, int gy, int gw, int gh, int pts, Color c,
                       bool thr, float &mn, float &mx) {
        mn = NAN; mx = NAN;
        for (int k = 0; k < pts; k++) {
          const float v = tpms::hist_at(i, k);
          if (std::isnan(v)) continue;
          if (std::isnan(mn) || v < mn) mn = v;
          if (std::isnan(mx) || v > mx) mx = v;
        }
        if (thr) {
          if (std::isnan(mn) || L[i]->state < mn) mn = L[i]->state;
          if (std::isnan(mx) || H[i]->state > mx) mx = H[i]->state;
        }
        if (std::isnan(mn)) return;
        float span = mx - mn;
        if (span < 0.1f) { mn -= (0.1f - span) / 2; mx = mn + 0.1f; span = 0.1f; }
        mn -= span * 0.08f; mx += span * 0.08f;
        auto Y = [&](float v) { return gy + gh - 1 - (int) ((v - mn) / (mx - mn) * (gh - 1)); };
        if (thr) {
          for (int xx = gx; xx < gx + gw; xx += 4) {
            it.draw_pixel_at(xx, Y(L[i]->state), id(c_thr));
            it.draw_pixel_at(xx + 1, Y(L[i]->state), id(c_thr));
            it.draw_pixel_at(xx, Y(H[i]->state), id(c_thr));
            it.draw_pixel_at(xx + 1, Y(H[i]->state), id(c_thr));
          }
        }
        bool prev = false; int px = 0, py = 0;
        for (int k = pts - 1; k >= 0; k--) {
          const float v = tpms::hist_at(i, k);
          const int xx = gx + (pts - 1 - k) * (gw - 1) / (pts - 1);
          if (std::isnan(v)) { prev = false; continue; }
          const int yy = Y(v);
          if (prev) it.line(px, py, xx, yy, c); else it.draw_pixel_at(xx, yy, c);
          px = xx; py = yy; prev = true;
        }
      };

      auto age_str = [&](int i, char *b, size_t n) {
        const uint32_t s = (now - tpms::W[i].last_ms) / 1000;
        if (s < 60) snprintf(b, n, "%uс", (unsigned) s);
        else if (s < 3600) snprintf(b, n, "%uм", (unsigned) (s / 60));
        else snprintf(b, n, "%uч", (unsigned) (s / 3600));
      };

      // ------------------------------------------------------- домашний экран
      if (id(view) == 0 && !id(set_mode)) {
        static const char *WD[7] = {"воскресенье", "понедельник", "вторник", "среда",
                                    "четверг", "пятница", "суббота"};
        auto tn = id(ha_time).now();
        if (!tn.is_valid()) tn = id(sntp_time).now();

        // Время и дата одним пиксельным шрифтом: время x3, дата x1 справа.
        if (tn.is_valid()) {
          it.printf(4, 0, id(f_px3), id(c_white), "%02d:%02d:%02d", tn.hour, tn.minute, tn.second);
          it.printf(204, 4, id(f_px1), id(c_text), "%02d.%02d.%04d", tn.day_of_month, tn.month, tn.year);
          it.print(204, 21, id(f_px1), id(c_dim), WD[(tn.day_of_week + 6) % 7]);
        } else {
          it.print(4, 0, id(f_px3), id(c_grey), "--:--:--");
          const uint32_t up = now / 1000;
          it.print(204, 4, id(f_px1), id(c_amber), "нет времени");
          it.printf(204, 21, id(f_px1), id(c_dim), "up %u:%02u:%02u",
                    (unsigned) (up / 3600), (unsigned) (up / 60 % 60), (unsigned) (up % 60));
        }
        // Сеть нужна только для часов и HA, датчики идут по BLE без нее.
        const bool wf = wifi::global_wifi_component->is_connected();
        it.print(204, 38, id(f_px1), wf ? id(c_dim) : id(c_grey), wf ? "сеть: дом" : "сеть: нет");

        // Четыре ячейки внизу, прозрачные: мотоцикл просвечивает сквозь них.
        for (int i = 0; i < tpms::N; i++) {
          const auto &w = tpms::W[i];
          const int x = 1 + i * 80, y = 55, cw2 = 78, chh = 115;
          const bool fr = tpms::fresh(i, stale);
          const uint32_t age = now - w.last_ms;
          if (w.alarm && fr) {
            it.filled_rectangle(x, y, cw2, chh, (!w.acked && blink) ? id(c_red) : id(c_darkred));
          }
          // Рамка вспыхивает на каждый пакет и гаснет за полсекунды.
          const bool flash = w.seen && age < 500;
          it.rectangle(x, y, cw2, chh, flash ? id(c_ktm) : id(c_grid));
          if (flash) it.rectangle(x + 1, y + 1, cw2 - 2, chh - 2, id(c_ktm));
          it.print(x + cw2 / 2, y + 3, id(f_px1), id(c_text), TextAlign::TOP_CENTER, NAME[i]);
          it.printf(x + cw2 / 2, y + 46, id(f_px1), id(c_dim), TextAlign::TOP_CENTER,
                    "%.1f-%.1f", L[i]->state, H[i]->state);
          if (w.seen) {
            const Color fg = !fr ? id(c_grey) : (w.alarm ? id(c_white) : id(c_ok));
            it.printf(x + cw2 / 2, y + 31, id(f_num), fg, TextAlign::CENTER, "%.2f", w.bar);
            char a[12]; age_str(i, a, sizeof(a));
            it.print(x + 4, y + 62, id(f_px1), id(c_text), a);
            it.printf(x + cw2 - 4, y + 62, id(f_px1), id(c_dim), TextAlign::TOP_RIGHT, "%.0f°", w.temp);
            it.printf(x + 4, y + 78, id(f_px1), id(c_dim), "%d%%", w.batt);
            it.printf(x + cw2 - 4, y + 78, id(f_px1), id(c_dim), TextAlign::TOP_RIGHT, "%d", w.rssi);
            it.printf(x + cw2 / 2, y + 94, id(f_px1), id(c_dim), TextAlign::TOP_CENTER, "%u пак",
                      (unsigned) w.packets);
            // Полоска свежести: полная сразу после пакета, к stale_min пустая.
            float fr01 = 1.0f - (float) age / (float) stale;
            if (fr01 < 0) fr01 = 0;
            const int bw = (int) ((cw2 - 8) * fr01);
            it.filled_rectangle(x + 4, y + chh - 5, cw2 - 8, 2, id(c_tile));
            if (bw > 0) it.filled_rectangle(x + 4, y + chh - 5, bw, 2, fr01 > 0.5f ? id(c_ok) : id(c_amber));
          } else {
            it.print(x + cw2 / 2, y + 31, id(f_num), id(c_grey), TextAlign::CENTER, "-.--");
            it.print(x + cw2 / 2, y + 62, id(f_px1), id(c_grey), TextAlign::TOP_CENTER, "спит");
          }
        }
        return;
      }

      // ------------------------------------------------------- экран датчика
      if (id(view) >= 2 && !id(set_mode)) {
        const int i = id(view) - 2;
        const auto &w = tpms::W[i];
        const bool fr = tpms::fresh(i, stale);
        Color fg = !fr ? id(c_grey) : (w.alarm ? id(c_red) : id(c_ok));
        // Шапка
        it.filled_rectangle(0, 0, 320, 18, w.alarm && !w.acked && blink ? id(c_red) : id(c_ktm));
        it.printf(4, 1, id(f_px1), id(c_bg), "%d/4  %s", i + 1, NAME[i]);
        it.printf(316, 1, id(f_px1), id(c_bg), TextAlign::TOP_RIGHT, "%02X:%02X:%02X:%02X:%02X:%02X",
                  tpms::MAC[i][0], tpms::MAC[i][1], tpms::MAC[i][2],
                  tpms::MAC[i][3], tpms::MAC[i][4], tpms::MAC[i][5]);
        if (!w.seen) {
          it.print(160, 50, id(f_px1), id(c_grey), TextAlign::CENTER, "нет пакетов с включения");
          it.print(160, 80, id(f_px1), id(c_dim), TextAlign::CENTER, "датчик спит без давления");
        } else {
          it.printf(4, 20, id(f_big), fg, "%.2f", w.bar);
          char a[12]; age_str(i, a, sizeof(a));
          // Правая колонка
          const int cx = 172;
          it.printf(cx, 21, id(f_px1), id(c_text), "%.1f°C   бат %d%%", w.temp, w.batt);
          if (w.last_epoch) {
            struct tm lt; time_t e = w.last_epoch; localtime_r(&e, &lt);
            it.printf(cx, 37, id(f_px1), id(c_dim), "%02d:%02d:%02d  %s", lt.tm_hour, lt.tm_min, lt.tm_sec, a);
          } else {
            it.printf(cx, 37, id(f_px1), id(c_dim), "%s назад", a);
          }
          if (!std::isnan(w.gap_s)) it.printf(cx, 53, id(f_px1), id(c_dim), "раз в %.0fс %ddBm", w.gap_s, w.rssi);
          else it.printf(cx, 53, id(f_px1), id(c_dim), "пак %u %ddBm", (unsigned) w.packets, w.rssi);
          const float r = tpms::rate_bar_h(i, 10);
          if (std::isnan(r)) it.print(cx, 69, id(f_px1), id(c_dim), "тренд: копим 10м");
          else it.printf(cx, 69, id(f_px1), r < -${leak_bar_h} ? id(c_amber) : id(c_dim),
                         "тренд %+.2f б/ч", r);
          it.printf(4, 69, id(f_px1), id(c_dim), "мин %.2f  макс %.2f", w.bar_min, w.bar_max);
        }
        // График за час
        const int gy = 88, gh = 82;
        it.rectangle(0, gy, 320, gh, id(c_tile));
        float mn, mx;
        graph(i, 1, gy + 1, 318, gh - 2, tpms::HIST, id(c_ok), true, mn, mx);
        if (!std::isnan(mn)) {
          it.printf(3, gy + 2, id(f_px1), id(c_dim), "%.2f", mx);
          it.printf(3, gy + gh - 2, id(f_px1), id(c_dim), TextAlign::BOTTOM_LEFT, "%.2f", mn);
        }
        it.print(317, gy + gh - 2, id(f_px1), id(c_dim), TextAlign::BOTTOM_RIGHT, "1 час");
        return;
      }

      // --------------------------------------------------- сетка 2x2 и настройки
      const int TW = 159, TH = 84;
      for (int i = 0; i < tpms::N; i++) {
        const auto &w = tpms::W[i];
        const int x = (i % 2) * 161, y = (i / 2) * 86;
        const bool fr = tpms::fresh(i, stale);
        Color bg = id(c_tile), fg = id(c_ok), lab = id(c_text), sub = id(c_dim), sp = id(c_spark);
        if (!fr) { fg = id(c_grey); }
        else if (w.alarm) {
          bg = (!w.acked && blink) ? id(c_red) : id(c_darkred);
          fg = id(c_white); lab = id(c_white); sub = id(c_white); sp = id(c_thr);
        }
        it.filled_rectangle(x, y, TW, TH, bg);
        it.print(x + 5, y + 3, id(f_px1), lab, NAME[i]);

        if (id(set_mode)) {
          // Настройки: мин и макс крупно, выбранный порог на янтарной подложке.
          for (int k = 0; k < 2; k++) {
            const bool sel = id(set_field) == i * 2 + k;
            const int ly = y + 19 + k * 32;
            if (sel) it.filled_rectangle(x + 3, ly, TW - 6, 32, blink ? id(c_amber) : id(c_ktm));
            const Color c = sel ? id(c_bg) : id(c_text);
            it.print(x + 8, ly, id(f_px2), c, k == 0 ? "мин" : "макс");
            it.printf(x + TW - 8, ly, id(f_px2), c, TextAlign::TOP_RIGHT, "%.1f",
                      k == 0 ? L[i]->state : H[i]->state);
          }
          continue;
        }

        if (w.seen) {
          // График последних 15 минут подложкой под цифрой.
          float mn, mx;
          graph(i, x + 4, y + 20, TW - 8, 46, 90, sp, false, mn, mx);
          it.printf(x + TW - 5, y + 3, id(f_px1), sub, TextAlign::TOP_RIGHT,
                    "%.0f° %d%%", w.temp, w.batt);
          it.printf(x + TW / 2, y + 44, id(f_big), fg, TextAlign::CENTER, "%.2f", w.bar);
          char a[12]; age_str(i, a, sizeof(a));
          it.print(x + TW - 5, y + TH - 3, id(f_px1), sub, TextAlign::BOTTOM_RIGHT, a);
        } else {
          it.print(x + TW / 2, y + 44, id(f_big), id(c_grey), TextAlign::CENTER, "-.--");
        }
        it.printf(x + 5, y + TH - 3, id(f_px1), sub, TextAlign::BOTTOM_LEFT,
                  "%.1f-%.1f", L[i]->state, H[i]->state);
      }

      if (id(set_mode)) {
        it.filled_rectangle(0, 84, 320, 2, id(c_ktm));
      }
