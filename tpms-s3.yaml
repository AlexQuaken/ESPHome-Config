# tpms-s3 — LilyGO T-Display-S3 (MAC a0:f2:62:e1:43:ec), монитор давления
# в шинах на 4 BLE-колпачка AIYATO BLE TPMS (формат TPMSII, разбор в tpms_s3.h).
#
# Плата слушает датчики сама, без телефона и без сети. Дома цепляется к Wi-Fi
# и отдает в HA давление, температуру, батарею, тревоги и пороги. Вне дома
# просто работает дальше: reboot_timeout у wifi и api выключен, иначе пакет
# 1wifi_api_ota_logger перезагружал бы плату каждые 3 минуты без сети.
#
# При включении ~23 секунды идет лог загрузки в духе dmesg/systemd в цветах
# KTM. Строки про память, NVS, BLE, датчики и Wi-Fi настоящие. Строки про
# диагностику, ЭБУ, OCU, зажигание и датчики мотоцикла это декорация, но с
# настоящими узлами и цифрами из руководства 350 EXC-F SIX DAYS 2025: к
# проводке плата не подключена. Любая кнопка пропускает загрузку.
#
# Экраны по кругу короткими нажатиями: домашний, сетка 2x2, четыре экрана
# датчиков. Все подписи пиксельным PxPlus IBM VGA 8x16 (x1, x2, x3 от
# родного размера 16, иначе буквы ломаются), давление шрифтом ArchivoBlack.
#
# Домашний: черный фон (картинку мотоцикла юзер попросил убрать 04.10.2026,
# images/ktm_bg.png остался в репо), время ЧЧ:ММ:СС, дата цифрами и день недели,
# есть ли домашняя сеть (нужна только часам и HA, датчики идут по BLE),
# внизу четыре ячейки: давление, пороги, возраст пакета, температура,
# батарея, RSSI, число пакетов с включения, полоска свежести, вспышка рамки
# на каждый пакет. Время из HA, запасное SNTP. Включили вне дома, значит вместо
# часов прочерки и аптайм: своих часов с батарейкой у платы нет.
#
# Сетка 2x2: по плитке на датчик, давление, за ним график последних 15 минут,
# температура, батарея, пороги и сколько прошло с последнего пакета.
# Нет пакетов дольше stale_min минут, плитка серая. Давление вне порогов,
# плитка мигает красным и подсветка уходит на 100 %.
#
# Экран датчика: график за час с линиями порогов, минимум и максимум с
# включения, скорость изменения давления в бар/ч за 10 минут (минус это
# утечка, янтарным при быстрее leak_bar_h), RSSI и интервал между пакетами.
#
# Кнопки (KEY = GPIO14, BOOT = GPIO0):
#   коротко KEY / BOOT     вне настроек: экран вперед / назад, заодно
#                          подтверждают тревогу (мигание стоп)
#                          в настройках: +0,1 / -0,1 бар
#   долго (>0,8 с) любая   вход в настройки, дальше каждое долгое нажатие
#                          переходит к следующему порогу (1 мин, 1 макс,
#                          2 мин ... 4 макс), после последнего выход
# Из настроек плата сама выходит через 30 с без нажатий. Пороги хранятся во
# флеше (restore_value) и правятся также из HA.
#
# Истории и выгрузки пока нет, это следующий шаг.

substitutions:
  board_name: 'tpms-s3'
  # .222 занят телефоном Bison на мотоцикле, не путать
  static_ip: '192.168.0.233'
  # Подписи плиток. Порядок как в tpms::MAC: позиции 80, 81, 82, 83.
  # 1 и 2 стоят на сердечниках TUbliss (перед, зад), 3 и 4 на покрышках
  # (перед, зад). Не длиннее 8 знаков, иначе не влезает в ячейку.
  name_0: 'TUB ПЕР'
  name_1: 'TUB ЗАД'
  name_2: 'ШИНА ПЕР'
  name_3: 'ШИНА ЗАД'
  # Имена сущностей в HA. Латиницей: ESPHome строит из имени ASCII-ID, и
  # кириллица после TUB у двух датчиков давала одинаковый id. Входят в ключ
  # сохранения порогов, как и раньше имена плиток.
  ha_0: 'TUB front'
  ha_1: 'TUB rear'
  ha_2: 'Tire front'
  ha_3: 'Tire rear'
  # Пороги по умолчанию, действуют только до первой правки.
  lo_0: '6.4'
  hi_0: '9.0'
  lo_1: '6.4'
  hi_1: '9.0'
  lo_2: '0.4'
  hi_2: '1.2'
  lo_3: '0.4'
  hi_3: '1.2'
  stale_min: '15'
  # Падение быстрее этого (бар/ч) подсвечивается на экране датчика.
  leak_bar_h: '0.3'
  # Должно совпадать с tpms::HIST_STEP_S
  hist_step: '10'

esphome:
  name: ${board_name}
  includes:
    - tpms_s3.h

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

packages:
  device_base: !include packages/1wifi_api_ota_logger.yaml

wifi:
  reboot_timeout: 0s
  # Точка доступа при потере сети тут только мешает: вне дома сети нет почти
  # всегда, и AP висела бы постоянно, отъедая эфир у BLE.
  ap: !remove

api:
  reboot_timeout: 0s

logger:
  hardware_uart: USB_CDC

esp32_ble_tracker:
  scan_parameters:
    # Все данные датчика лежат в самом объявлении, запрос scan response не нужен.
    active: false
    interval: 100ms
    window: 90ms
    continuous: true
  on_ble_advertise:
    - then:
        - lambda: |-
            for (auto &md : x.get_manufacturer_datas()) {
              int i = tpms::parse(md.data, x.get_rssi());
              if (i < 0) continue;
              auto &w = tpms::W[i];
              auto tn = id(ha_time).now();
              if (!tn.is_valid()) tn = id(sntp_time).now();
              w.last_epoch = tn.is_valid() ? tn.timestamp : 0;
              id(last_pkt_idx) = i;
              id(rx_total)++;
              ESP_LOGD("tpms", "#%d %.3f bar %.1f C bat %d%% al %d rssi %d",
                       i, w.bar, w.temp, w.batt, w.sensor_alarm, x.get_rssi());
              // В HA не чаще раза в минуту, если давление не сдвинулось
              // на 0,02 бар: датчик на колесе вещает раз в несколько секунд.
              uint32_t now = millis();
              if (std::isnan(w.pub_bar) || fabsf(w.bar - w.pub_bar) >= 0.02f ||
                  now - w.pub_ms > 60000) {
                w.pub_bar = w.bar;
                w.pub_ms = now;
                sensor::Sensor *P[4] = {id(p0), id(p1), id(p2), id(p3)};
                sensor::Sensor *T[4] = {id(t0), id(t1), id(t2), id(t3)};
                sensor::Sensor *B[4] = {id(b0), id(b1), id(b2), id(b3)};
                P[i]->publish_state(w.bar);
                T[i]->publish_state(w.temp);
                B[i]->publish_state(w.batt);
              }
            }

globals:
  - id: set_mode
    type: bool
    initial_value: 'false'
  # Порог в настройках: 0..7, датчик = field / 2, четный мин, нечетный макс
  - id: set_field
    type: int
    initial_value: '0'
  - id: set_touch_ms
    type: uint32_t
    initial_value: '0'
  # 0 домашний, 1 сетка, 2..5 экран датчика
  - id: view
    type: int
    initial_value: '0'
  - id: boot_t0
    type: uint32_t
    initial_value: '0'
  - id: boot_done
    type: bool
    initial_value: 'false'
  - id: last_pkt_idx
    type: int
    initial_value: '-1'
  - id: rx_total
    type: uint32_t
    initial_value: '0'

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Kyiv
  - platform: sntp
    id: sntp_time
    timezone: Europe/Kyiv
    servers:
      - 192.168.0.1
      - 0.pool.ntp.org
      - 1.pool.ntp.org

script:
  # Короткое: в настройках +-0,1 бар, иначе экран вперед/назад.
  # Любое короткое заодно подтверждает тревоги и пропускает загрузку.
  - id: short_press
    parameters:
      dir: int
    then:
      - lambda: |-
          if (!id(boot_done)) { id(boot_done) = true; return; }
          for (int i = 0; i < tpms::N; i++)
            if (tpms::W[i].alarm) tpms::W[i].acked = true;
          if (id(set_mode)) {
            id(bump_threshold).execute(dir * 0.1f);
          } else {
            id(view) = (id(view) + dir + 6) % 6;
          }
  # Долгое: вход в настройки, следующий порог, после восьмого выход.
  - id: long_press
    then:
      - lambda: |-
          if (!id(boot_done)) { id(boot_done) = true; return; }
          if (!id(set_mode)) {
            id(set_mode) = true;
            id(set_field) = 0;
          } else if (id(set_field) < 7) {
            id(set_field)++;
          } else {
            id(set_mode) = false;
          }
          id(set_touch_ms) = millis();
  - id: bump_threshold
    parameters:
      delta: float
    then:
      - lambda: |-
          number::Number *L[4] = {id(lo0), id(lo1), id(lo2), id(lo3)};
          number::Number *H[4] = {id(hi0), id(hi1), id(hi2), id(hi3)};
          int f = id(set_field);
          number::Number *n = (f % 2 == 0) ? L[f / 2] : H[f / 2];
          float v = roundf((n->state + delta) * 10.0f) / 10.0f;
          if (v < 0.0f) v = 0.0f;
          if (v > 10.0f) v = 10.0f;
          n->make_call().set_value(v).perform();
          id(set_touch_ms) = millis();

binary_sensor:
  - platform: gpio
    id: btn_key
    internal: true
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - min_length: 30ms
        max_length: 600ms
        then:
          - script.execute:
              id: short_press
              dir: 1
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: long_press

  - platform: gpio
    id: btn_boot
    internal: true
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    on_click:
      - min_length: 30ms
        max_length: 600ms
        then:
          - script.execute:
              id: short_press
              dir: -1
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: long_press

  - platform: template
    id: al0
    name: ${ha_0} тревога
    device_class: problem
  - platform: template
    id: al1
    name: ${ha_1} тревога
    device_class: problem
  - platform: template
    id: al2
    name: ${ha_2} тревога
    device_class: problem
  - platform: template
    id: al3
    name: ${ha_3} тревога
    device_class: problem

sensor:
  - platform: template
    id: p0
    name: ${ha_0} давление
    unit_of_measurement: bar
    device_class: pressure
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: p1
    name: ${ha_1} давление
    unit_of_measurement: bar
    device_class: pressure
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: p2
    name: ${ha_2} давление
    unit_of_measurement: bar
    device_class: pressure
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: p3
    name: ${ha_3} давление
    unit_of_measurement: bar
    device_class: pressure
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: t0
    name: ${ha_0} температура
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: t1
    name: ${ha_1} температура
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: t2
    name: ${ha_2} температура
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: t3
    name: ${ha_3} температура
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: b0
    name: ${ha_0} батарея
    unit_of_measurement: '%'
    device_class: battery
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: b1
    name: ${ha_1} батарея
    unit_of_measurement: '%'
    device_class: battery
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: b2
    name: ${ha_2} батарея
    unit_of_measurement: '%'
    device_class: battery
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: b3
    name: ${ha_3} батарея
    unit_of_measurement: '%'
    device_class: battery
    accuracy_decimals: 0
    update_interval: never

number:
  - platform: template
    id: lo0
    name: ${ha_0} мин
    optimistic: true
    restore_value: true
    initial_value: ${lo_0}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: hi0
    name: ${ha_0} макс
    optimistic: true
    restore_value: true
    initial_value: ${hi_0}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: lo1
    name: ${ha_1} мин
    optimistic: true
    restore_value: true
    initial_value: ${lo_1}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: hi1
    name: ${ha_1} макс
    optimistic: true
    restore_value: true
    initial_value: ${hi_1}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: lo2
    name: ${ha_2} мин
    optimistic: true
    restore_value: true
    initial_value: ${lo_2}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: hi2
    name: ${ha_2} макс
    optimistic: true
    restore_value: true
    initial_value: ${hi_2}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: lo3
    name: ${ha_3} мин
    optimistic: true
    restore_value: true
    initial_value: ${lo_3}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box
  - platform: template
    id: hi3
    name: ${ha_3} макс
    optimistic: true
    restore_value: true
    initial_value: ${hi_3}
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: bar
    mode: box

interval:
  - interval: ${hist_step}s
    then:
      - lambda: 'tpms::hist_push(${stale_min} * 60000UL);'
  # Раз в секунду: тревоги и автовыход из настроек.
  - interval: 1s
    then:
      - lambda: |-
          number::Number *L[4] = {id(lo0), id(lo1), id(lo2), id(lo3)};
          number::Number *H[4] = {id(hi0), id(hi1), id(hi2), id(hi3)};
          binary_sensor::BinarySensor *A[4] = {id(al0), id(al1), id(al2), id(al3)};
          const uint32_t stale = ${stale_min} * 60000UL;
          bool loud = false;
          for (int i = 0; i < tpms::N; i++) {
            auto &w = tpms::W[i];
            bool a = tpms::fresh(i, stale) &&
                     (w.bar < L[i]->state || w.bar > H[i]->state || w.sensor_alarm);
            if (a && !w.alarm) {
              w.acked = false;
              ESP_LOGW("tpms", "#%d тревога: %.2f bar, пороги %.1f..%.1f",
                       i, w.bar, L[i]->state, H[i]->state);
            }
            w.alarm = a;
            if (!A[i]->has_state() || A[i]->state != a) A[i]->publish_state(a);
            if (a && !w.acked) loud = true;
          }
          // Неподтвержденная тревога: подсветка на 100 %, чтобы видно было днем.
          if (loud && id(backlight).current_values.get_brightness() < 0.99f) {
            auto call = id(backlight).turn_on();
            call.set_brightness(1.0f);
            call.perform();
          }
          if (id(set_mode) && millis() - id(set_touch_ms) > 30000) id(set_mode) = false;

spi:
  - id: display_bus
    type: octal
    clk_pin: GPIO8
    data_pins: [GPIO39, GPIO40, GPIO41, GPIO42, GPIO45, GPIO46, GPIO47, GPIO48]

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: ${board_name} подсветка
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 300ms

font:
  # PxPlus: родной размер 16, кратные 32 и 48 дают ровный пиксель x2 и x3.
  # На других размерах буквы ломаются.
  - file: "fonts/PxPlus_IBM_VGA_8x14.ttf"
    id: f_con
    size: 16
    bpp: 1
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: f_px1
    size: 16
    bpp: 1
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°абвгдежзийклмнопрстуфхцчшщъыьэюяАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: f_px2
    size: 32
    bpp: 1
    glyphs: '0123456789.,:-+ минакс'
  - file: "fonts/PxPlus_IBM_VGA_8x16.ttf"
    id: f_px3
    size: 48
    bpp: 1
    glyphs: '0123456789:-'
  # Давление: на экране датчика и в сетке крупно, в ячейках домашнего мельче
  - file: "fonts/ArchivoBlack-Regular.ttf"
    id: f_big
    size: 40
    bpp: 4
    glyphs: '0123456789.-'
  - file: "fonts/ArchivoBlack-Regular.ttf"
    id: f_num
    size: 26
    bpp: 4
    glyphs: '0123456789.-'

color:
